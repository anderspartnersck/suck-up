<!--
  SUCK UP — AIRY CUT — STANDALONE, PLAYABLE browser feel-build. A sandbox, NOT the
  game: it never imports or modifies suck_up.py. The canonical Python engine stays
  the source of truth (balance + determinism + break gates). This exists to PLAY
  the render-only air-cushion GLIDE in real combat, at full sprite size.

  This cut now ports ALL SIX ZONES — the old model's exact run, Dairy Flats through the
  Outskirts: real names, clocks, scenery, spawn flavor (person_bias), starting Military
  Response (meter0), RUSH goals, AA-from-start, THE RUN scroll_start, and MO the Dairy
  Flats boss — values lifted from src/suck_up.py ROUNDS. It is a faithful REPRESENTATION
  of the levels' content/feel, not a byte-exact engine port (that'd fork the engine).
  Scenery + ground sprites are HEIGHT-keyed (sz()/scnH(), bottom-anchored) so tall/short
  silhouettes read in proportion at any width.

  Opens on the CASTLE KILLSCREEN ident (the house boot), then the title.
  Render rule: the saucer TARGET snaps on a grid like move_player(); the DRAWN saucer
  springs toward it (clamped, never past) so grid-jitter disappears and it flies.
-->
<style>

     Hidden entirely in the ARCADE/STICK cab builds (a real cab has a pot inside the cabinet,

     dead ground plane, clear of the centred MILITARY RESPONSE meter. Slim row, not a stack. */

    padding:6px 12px;background:rgba(4,12,10,0.82);border:1px solid #28543a;border-right:0;border-radius:6px 0 0 6px;

<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var reelVid=document.getElementById('reel');                      // THE SUCK UP FILES — the real baked reel (mp4)
var W=0,H=0; function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; } addEventListener('resize',resize); resize();
function rnd(a,b){ return a+(b-a)*Math.random(); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function chance(p){ return Math.random()<p; }

/* ---------- real sprites ---------- */
var IMG={};
function load(n,p){ var im=new Image(); im.onload=function(){im.ok=true;}; im.onerror=function(){im.ok=false;}; im.src=p; IMG[n]=im; }

load('p1',A+'p1-saucer.png'); load('beam',A+'beam-green.png'); load('ring',A+'ground-ring.png');
for(var i=0;i<6;i++) load('w'+i,A+'p1-warble-'+i+'.png');
load('p2',A+'p2-saucer.png'); load('beam2',A+'beam-blue.png');                       // the blue rival UFO + its beam
for(var i=0;i<6;i++) load('rw'+i,A+'p2-warble-'+i+'.png');
load('impact_g',A+'impact-super-green.png'); load('impact_b',A+'impact-super-blue.png');   // beam ground-contact rings (was the plain ground-ring)
['cow','cow_b','cow_c','cow_lift','person','person_b','person_c','farmer','dave','brisket','jet','tank','moon','repair',

 'barn','silo','tree','water_tower','windmill','haybale','corn','powerup','bush',

 'crab','old_bay','mallet','bushel','the_bull'].forEach(function(n){ load(n,AR+n+'.png'); });
function ok(n){ var im=IMG[n]; return im&&im.ok; }
function drawImg(n,x,y,w,rot,alpha,flip,smooth){
  var im=IMG[n]; if(!im||!im.ok) return false;
  var ar=im.naturalWidth/im.naturalHeight, h=w/ar;
  ctx.save(); ctx.globalAlpha=alpha==null?1:alpha; ctx.imageSmoothingEnabled=smooth!==false;
  if(ctx.imageSmoothingEnabled) ctx.imageSmoothingQuality='high';   // better resample = no shimmer on slow zooms (Ken Burns)
  ctx.translate(x,y); if(rot) ctx.rotate(rot); if(flip) ctx.scale(-1,1);
  ctx.drawImage(im,-w/2,-h/2,w,h); ctx.restore(); return true;
}
// KEN BURNS anti-shimmer: pre-scale a big image ONCE into an offscreen canvas near its display
// height, so the per-frame zoom is only a gentle downscale (no crawling on high-detail edges like
// the cab bezel). Rebuilt only when the target size drifts (or on resize).
var _kb={};
function kenScaled(name, dispH){
  var im=IMG[name]; if(!im||!im.ok) return null;
  var tH=Math.max(2,Math.ceil(dispH)), c=_kb[name];
  if(!c || Math.abs(c.h-tH) > tH*0.12){
    var tW=Math.max(2,Math.round(tH*(im.naturalWidth/im.naturalHeight)));
    var off=document.createElement('canvas'); off.width=tW; off.height=tH;
    var octx=off.getContext('2d'); octx.imageSmoothingEnabled=true; octx.imageSmoothingQuality='high';
    octx.drawImage(im,0,0,tW,tH); c=_kb[name]={cv:off,w:tW,h:tH};
  }
  return c;
}

/* ---------- glide (air cushion) ---------- */
var GLIDE=true, accel=210, damp=27;
function spring(o,tx,ty,dt){
  if(!GLIDE){ o.x=tx; o.y=ty; o.vx=o.vy=0; return; }
  var ox=o.x, oy=o.y;
  o.vx += ((tx-o.x)*accel - o.vx*damp)*dt;
  o.vy += ((ty-o.y)*accel - o.vy*damp)*dt;
  o.x += o.vx*dt; o.y += o.vy*dt;
  if((tx-ox)*(tx-o.x)<0){ o.x=tx; o.vx=0; }     // never coast past the target
  if((ty-oy)*(ty-o.y)<0){ o.y=ty; o.vy=0; }
}

/* ---------- world ---------- */
function groundY(){ return H*0.84; }
function band(){ return {top:H*0.20, bot:H*0.70}; }
function SAUCER_W(){ return clamp(W*0.085,90,180); }
// ground-sprite sizes keyed to HEIGHT (so tall/short sprite proportions read consistently)
function sz(){ var cowH=clamp(W*0.044,30,50); return { people:clamp(W*0.036,24,40), cow:cowH, tank:cowH*0.84 }; }
// SCENERY sizing — same HEIGHT-keyed rule as sz(), as fractions of H (the screen), so a
// tower reads tall and a haybale short regardless of the PNG's pixel size (width-keying
// made tall silhouettes balloon). Bottom-anchored to the ground line at draw time.
var SCN_H={ highrise:0.40,tower_c:0.38,tower_a:0.35,tower_b:0.31,office:0.33,water_tower:0.31,

  barracks:0.105,bunker:0.095, tree:0.21,corn:0.14,haybale:0.085,bush:0.10,
  // 0710 IT buildings — HEIGHT-keyed to real proportions (wide sprites get a SHORT height so their width doesn't balloon: shops ar3.7 / bldg6 ar2.9 / houses ar2.6 / skylines ar5-7)
  it_highrise:0.42,it_office:0.34,it_morale_corp:0.36,it_brick:0.26,it_penalty_box:0.20,it_bldg6:0.17,it_shops:0.155,
  it_house_1:0.16,it_house_2:0.16,it_house_3:0.17,it_house_4:0.165,it_house_5:0.155,it_house_6:0.155,
  it_house_7:0.18,it_house_8:0.185,it_house_9:0.20,it_house_10:0.19,it_house_11:0.175,it_house_12:0.19,
  it_corn_stalk:0.19, it_corn_1:0.20,it_corn_2:0.22,it_corn_3:0.17,it_corn_4:0.21,it_corn_5:0.21, it_corn_machine:0.17,
  it_skyline_a:0.11,it_skyline_b:0.085 };   // downtown buildings scaled to the artist's relative heights (tower>office>mini-mart>diner); barracks is 4.7:1 wide so its HEIGHT stays low
function scnH(n){ return H*(SCN_H[n]||0.16); }
// INTENTIONAL DEPTH per prop (not random): distant LANDMARKS recede to the back (dim/small/raised),
// the near HOMESTEAD / street-level buildings stay prominent up front. Reads as a real place, not a scatter.
var PROP_DEPTH={ barn:1.0,house:1.0,restaurant:1.0,storefront:1.0,barracks:0.7,haybale:1.0,corn:0.95,tree:0.95,bush:0.9,dog:1.0,
  office:0.72,bunker:0.82,
  water_tower:0.5,windmill:0.5,highrise:0.5,tower_c:0.48,tower_a:0.45,radar:0.45,silo:0.44,tower_b:0.4,
  // 0710 IT: street-level shops/houses stay near+bright; glass towers recede; skylines + MORALE CORP sit deepest (dim, raised to the horizon)
  it_shops:0.92,it_bldg6:0.95,it_penalty_box:0.88,it_brick:0.8,it_house_1:1.0,it_house_2:1.0,it_house_3:1.0,it_house_4:1.0,it_house_5:1.0,it_house_6:1.0,
  it_house_7:1.0,it_house_8:1.0,it_house_9:1.0,it_house_10:1.0,it_house_11:1.0,it_house_12:1.0,
  it_corn_stalk:0.95, it_corn_1:0.62,it_corn_2:0.6,it_corn_3:0.5,it_corn_4:0.66,it_corn_5:0.6, it_corn_machine:1.0,
  it_office:0.66,it_highrise:0.48,it_morale_corp:0.42,it_skyline_a:0.35,it_skyline_b:0.35 };
function propDepth(s){ return clamp((PROP_DEPTH[s]!=null?PROP_DEPTH[s]:0.82)*rnd(0.9,1.06), 0.35, 1.0); }
// SCENERY BUILDER — a prop entry is either a string (name, depth from PROP_DEPTH) OR an object
// {s:name, d:depthOverride 0.35..1, sc:scaleMult}. The override is what lets one zone stack the SAME
// building type at different depths (true front/back layering, not a flat single-depth row). Items are
// depth-sorted so far draws behind near. `x0`/`step` = first-prop x + per-prop spacing (fractions of W).
function propNode(pr,i,x0,step){
  var nm=(typeof pr==='string')?pr:pr.s;
  var d =(pr&&typeof pr==='object'&&pr.d!=null)?clamp(pr.d*rnd(0.96,1.04),0.3,1.0):propDepth(nm);
  var scv=(pr&&typeof pr==='object'&&pr.sc!=null)?pr.sc:1;
  return { x:W*(x0+i*step+rnd(-0.022,0.022)), s:nm, sc:scv*rnd(0.93,1.05), d:d };
}
function buildScenery(props,x0,step){ scenery=[]; for(var i=0;i<props.length;i++) scenery.push(propNode(props[i],i,x0,step)); scenery.sort(function(a,b){return a.d-b.d;}); }

function zoneOfSeg(si){ if(SCHEDULE[si]!=='R') return -1; var r=0; for(var i=0;i<si;i++) if(SCHEDULE[i]==='R') r++; return r; }

function beginSegment(){

  else if(seg==='M'){ startBase(false); }

  resLast=(segIdx+1>=SCHEDULE.length);                    // final segment -> the card leads into the credit page
  showResult();                                           // the "where you're at" beat, THEN proceedSegment() picks up the schedule
}

  var ri=0; for(var i=0;i<=segIdx;i++) if(SCHEDULE[i]==='R') ri++;                    // rounds cleared so far -> next zone index

  if(pad2){ var b2=pad2.buttons||[], m2=(pad2.mapping==='standard')?{}:gpMap(); var beam2=(m2.beam!=null?b2[m2.beam]:b2[0])&&(m2.beam!=null?b2[m2.beam]:b2[0]).pressed;

    if(state==='lockin'){ if(beam2 && !GP2beam){ twoP=true; try{sfx('snatch',0.5);}catch(e){} flash('PLAYER 2 IS IN','#3cc8ff',1.2); startRun(); } }
    else if(twoP){ var g2=Ghost.read(pad2); held2.left=g2.x<0; held2.right=g2.x>0; held2.up=g2.y<0; held2.down=g2.y>0; planting2=!!beam2;

function pumpPlayer(dt){

      var lead=MOUSE_LEAD*(dt||0.016);
      P.tx=clamp(P.tx+clamp(MOUSE.x-P.tx,-lead,lead),W*0.05,W*0.95);
      P.ty=clamp(P.ty+clamp(MOUSE.y-P.ty,-lead,lead),b.top,b.bot);
    } else {                                                                  // WASD / arrows / stick — hold combos (e.g. W+A) for 8-WAY diagonals (each axis nudges independently)
      if(held.left &&clock>=nf.left ){ P.tx=clamp(P.tx-STEP,W*0.05,W*0.95); nf.left =(nf.left ===clock?clock+delay:nf.left )+repeat; }
      if(held.right&&clock>=nf.right){ P.tx=clamp(P.tx+STEP,W*0.05,W*0.95); nf.right=(nf.right===clock?clock+delay:nf.right)+repeat; }
      if(held.up   &&clock>=nf.up   ){ P.ty=clamp(P.ty-STEP,b.top,b.bot);   nf.up   =(nf.up   ===clock?clock+delay:nf.up   )+repeat; }
      if(held.down &&clock>=nf.down ){ P.ty=clamp(P.ty+STEP,b.top,b.bot);   nf.down =(nf.down ===clock?clock+delay:nf.down )+repeat; }
    }

}
function pumpRival(dt){   // 2-PLAYER: P2 flies the blue rival (mirror of pumpPlayer, drives R.beamOn)
  if(!R) return;

  if(R.stun>0){ R.stun-=dt; R.beamOn=false; spring(R,R.x,R.y,dt); return; }   // knocked — coasts
  var b=band();
  if(!planting2){
    if(held2.left &&clock>=nf2.left ){ R.tx=clamp(R.tx-STEP,W*0.05,W*0.95); nf2.left =(nf2.left ===clock?clock+delay:nf2.left )+repeat; }
    if(held2.right&&clock>=nf2.right){ R.tx=clamp(R.tx+STEP,W*0.05,W*0.95); nf2.right=(nf2.right===clock?clock+delay:nf2.right)+repeat; }
    if(held2.up   &&clock>=nf2.up   ){ R.ty=clamp(R.ty-STEP,b.top,b.bot);   nf2.up   =(nf2.up   ===clock?clock+delay:nf2.up   )+repeat; }
    if(held2.down &&clock>=nf2.down ){ R.ty=clamp(R.ty+STEP,b.top,b.bot);   nf2.down =(nf2.down ===clock?clock+delay:nf2.down )+repeat; }
  }

function ease01(v){ return v*v*(3-2*v); }   // smoothstep, for traffic that eases in and out of a crawl
function warblingS(s){ return s && clock<s.warbleU; }
function warbling(){ return warblingS(P); }

/* ---------- the blue rival (CPU antagonist) — port of _cpu_control: hunt, contest, race for prizes, dodge ---------- */
// BEAM CONTEST tuning — how a fought-over catch resolves. DRAG is the fraction of normal lock speed the
// ESTABLISHED owner keeps while contested (1 = contest does nothing, 0 = the old total denial).
var CONTEST_DRAG=0.45, CONTEST_BACKOFF=2.2;
// The blue ship's lift handicap. It exists to keep the CPU BEATABLE in a straight race -- it is a
// difficulty knob, not a property of the colour. In 2-PLAYER the blue ship is a HUMAN, so it must lift
// exactly as fast as green or P2 is simply playing a worse game. (Was applied unconditionally: a human
// P2 silently carried the CPU's 1.4x penalty for every catch.)
function blueLockMul(){ return twoP ? 1 : (defcon ? 1.1 : 1.4); }
var PRIZE_BIAS=0.45;   // how much of a head start (in screen widths) a prize is worth to the rival
function updateRival(dt){
  if(!R || mode==='base') return;
  if(R.invuln>0) R.invuln-=dt;
  if(R.stun>0){ R.stun-=dt; R.beamOn=false; spring(R,R.x,R.y,dt); return; }   // knocked — coasts, can't act
  var b=band(), behind = rivalScore<=score, RANGE=W*0.05;
  var hot = stageOf()>=2;                                                                       // ORANGE/RED = the lethal onslaught is up
  // 1) PICK a target: prizes (Mo/Dave/boss) >> contest the player's lock >> nearest cow/loot (people only when behind)
  var want=null, wbest=1e9;
  for(var i=0;i<targets.length;i++){ var c=targets[i]; if(c.gone||c.hidden||c.def.hazardGrab) continue;   // hidden critters aren't grabbable
    if(c.kind==='person' && !behind) continue;
    if(c===P.lock && (hot || clock<(R.contestCd||0))) continue;   // DEATH-SPIRAL FIX: under heat (ORANGE/RED) or during the re-contest cooldown, the rival won't grind on YOUR catch — it grabs elsewhere or bails to dodge, opening your window (greed still punished in the calm GREEN/YELLOW)
    var d=Math.abs(c.x-R.x);
    var contest = c===P.lock && (behind || d<W*(defcon?0.20:0.12));                             // DEFCON 1 ALLSTAR contests your catch from farther out
    // PRIZE bias was d-1e5 -- a hundred-thousand-pixel head start, so ANY prize anywhere outranked
    // everything and the rival beelined to Mo/Dave from across the map every single time. Distance
    // never entered into it, which is why it took every good spawn. It is now a finite head start:
    // worth PRIZE_BIAS of travel, so if you are meaningfully closer to Mo than the rival is, you win
    // the race to her. Still a priority, no longer a guarantee.
    var pr = (c.isMo||c.isBoss||(c.def.val||0)>=2000)? d-PRIZE_BIAS*W : (contest? d-W*0.03 : d);
    if(pr<wbest){ wbest=pr; want=c; } }

  for(var s=0;s<shots.length;s++){ var sh=shots[s]; if(sh.harmless) continue; if(Math.abs(sh.x-R.x)<W*0.06 && Math.abs(sh.y-R.y)<H*0.11){ var d=Math.abs(sh.x-R.x); if(d<hd){hd=d;hz=sh;} } }
  var destX=R.tx, destY=R.ty;
  if(hz){ R.beamOn=false;
    if(clock>R.warbleCd && hd<SAUCER_W()*0.6){ R.warbleU=clock+0.60; R.warbleCd=clock+2.0; }     // warble when it's about to connect
    destX=clamp(R.x+(hz.x>=R.x?-1:1)*W*0.18, W*0.05, W*0.95);
    destY=clamp(R.y+(hz.y>=R.y?-1:1)*H*0.12, b.top, b.bot);
  } else if(want){
    if(Math.abs(want.x-R.x)<RANGE){ R.beamOn=true; destX=R.x; destY=clamp(want.y-H*0.17, b.top, b.bot); }   // planted over it, beam down
    else { R.beamOn=false; destX=clamp(want.x, W*0.05, W*0.95); destY=clamp(want.y-H*0.17, b.top, b.bot); }
  } else { R.beamOn=false; destX=R.x; destY=(b.top+b.bot)/2; }

  var RVX=(defcon?292:270)*dt, RVY=(defcon?360:330)*dt;   // DEFCON 1 ALLSTAR keeps pace with the player (normal rival is a touch slower so it can't out-run you)
  R.tx += clamp(destX-R.tx, -RVX, RVX);
  R.ty += clamp(destY-R.ty, -RVY, RVY);

}

/* ---------- combat ---------- */
var MAX_FX=80, MAX_SHOTS=140, AIRSPACE_BONUS=250;   // reward for a skilled WARBLE-deflect that shoos a plane off (non-lethal peel-off — it retreats, never crashes)
function addFx(x,y,kind,col,n){ if(fx.length>=MAX_FX) fx.shift(); fx.push({x:x,y:y,kind:kind||'burst',col:col||'#ffd27a',t:0,life:n||0.45}); }
// EMP a strafing plane (caught by a BEAM or a warble RICOCHET): it loses its guns and SPINS OUT,
// tumbling back into the DISTANCE (recedes up + shrinks) and bursts in a puff — never crashes on the
// foreground. (Real crash/shoot-down systems belong to PAX GNOMANIA.)
function disableJet(je){ if(!je || je.disabled || je.horizon) return; je.disabled=true; je.spinT=0; je.scale=1;
  je.vy=-70; je.vx*=0.45; je.fireCd=1e9; addFx(je.x,je.y,'emp','#bfefff',0.5); sfxT('planedown',0.25,0.95); }   // EMP shockwave on the disabled plane
function hitPlayer(){

  if(warbling()||P.invuln>0) { addFx(P.x,P.y,'spark','#9affc0',0.3); return; }
  hp-=34; P.stun=1.1; P.invuln=2.0; shake=18; addFx(P.x,P.y,'boom','#ff7a3a',0.6); sfx('hit',0.5);
  if(hp<=0){ lives--;
    if(lives>0){ hp=maxHP; P.invuln=2.4; P.stun=0.6; addFx(P.x,P.y,'snatch','#7fe9ff',0.6); flash('SHIP DOWN — '+lives+' LEFT','#ff9d3a',1.4); if(level>=1) sayLater(pick(EXPLOSION_BARKS),'#ffd23f',0.7); }   // Dave cheers the shootdown (later zones)
    else { hp=0; state='over'; flash('SOMETHING HAPPENED…','#ff5d6c',99); }

function shoot(x,y,vx,vy,kind,col){ if(shots.length>=MAX_SHOTS) shots.shift(); shots.push({x:x,y:y,vx:vx,vy:vy,kind:kind,col:col,t:0,life:kind==='missile'?5:3}); }

function hitShip(sh,who){

  sh.stun=1.0; sh.invuln=1.6; sh.beamOn=false; shake=Math.max(shake,8); addFx(sh.x,sh.y,'boom','#7fb0ff',0.55);

    if(sh.hp<=0){ sh.hp=100; sh.lives=(sh.lives==null?STARTING_LIVES:sh.lives)-1; sh.stun=1.8; sh.invuln=2.6;
      addFx(sh.x,sh.y,'boom','#3cc8ff',0.7); addFx(sh.x,sh.y,'snatch','#7fb0ff',0.5);
      if(sh.lives<=0){ sh.lives=STARTING_LIVES; rivalScore=Math.max(0,rivalScore-CONTINUE_COST); flash('RIVAL CONTINUED  −'+CONTINUE_COST,'#3cc8ff',1.3); sfxT('denied',0.4,0.5); }   // every 3 lives -> as if it continued
    }

}

/* ---------- update ---------- */
function stageOf(){ return meter<35?0 : meter<65?1 : meter<90?2 : 3; }   // original curve: YELLOW 35 / ORANGE 65 / RED ~90
// HEIGHTENED RESPONSE — only urban/beltway/military maps get the RED onslaught (jet swarm + sourced ground AA).
// Rural maps (Dairy Flats / Corn Country) build the meter for TENSION but never unleash the lethal climax.
function onslaughtMap(){ var L=LEVELS[level]; return mode==='base' || (mode==='campaign' && !!(L&&(L.red||L.aa))); }
// ORDNANCE targets EITHER invader (not just the player) — the collision path already damages both ships.
function fireTarget(){ return (R && chance(0.5)) ? R : P; }
var STAGECOL=['#39ff14','#ffe23a','#ff9d3a','#ff5d6c'], STAGENAME=['GREEN','YELLOW','ORANGE','RED'];

function update(dt){
  t+=dt;
  if(state==='attract'){ if(msgT>0)msgT-=dt;
    if(attractMode==='reel'){ attractClk+=dt; if(attractClk>REEL_SEG) startDemoCut(); }   // reel pods, then cut to a live demo
    else { demoClk+=dt; updateAttract(dt); if(demoClk>DEMO_SEG) endDemoCut(); }            // live NEW-game demo cut
    return; }
  if(state==='ending'){ endT+=dt; if(msgT>0)msgT-=dt; if(endT>=9.5){ endGame(); } return; }   // credit page -> leaderboard
  if(state==='lockin'){ lockinT+=dt; if(msgT>0)msgT-=dt; if(lockinT>7){ twoP=false; startRun(); } return; }   // no answer in 7s -> solo
  if(state==='initials'){ idleT+=dt; if(msgT>0)msgT-=dt; if(idleT>30) confirmInitials(); return; }   // afk -> auto-lock the initials
  if(state==='board'){ boardT+=dt; if(msgT>0)msgT-=dt; if(boardT>10) enterFront(); return; }
  if(state==='result'){ resT+=dt; if(msgT>0)msgT-=dt; if(shake>0)shake*=0.9; if(resT>=RESULT_HOLD) proceedSegment(); return; }   // tally auto-advances (BEAM skips it)
  if(state!=='play'){ if(state==='select'||state==='over'||state==='clear')idleT+=dt; if(msgT>0)msgT-=dt; if(shake>0)shake*=0.9; return; }
  idleT=0;   // playing — reset the attract idle timer (so it counts from the game-over screen)
  while(score>=nextExtra && lives<99){ lives++; nextExtra+=EXTRA_LIFE; flash('★ EXTRA SHIP ★','#39ff14',1.5); sfx('pickup',0.55); }   // arcade extra-life reward
  clock+=dt; stageClock-=dt; if(msgT>0)msgT-=dt; if(shake>0)shake-=dt*40;
  if(pendBarkAt>0 && clock>=pendBarkAt){ pendBarkAt=0; flash(pendBark,pendBarkCol,1.8); }   // deferred barks (Dave answers, round-start hollers)
  if(P.stun>0)P.stun-=dt; if(P.invuln>0)P.invuln-=dt; if(superT>0)superT-=dt;
  var stg=stageOf(), L=LEVELS[level], elapsed=levelLen-stageClock;
  var aaHot = mode==='base' || (mode==='campaign' && L && L.aa);   // AA + jets hot from t=0 (THE BELTWAY / OUTSKIRTS)
  var ons = onslaughtMap();                                        // this map gets the heightened (RED) military response?

  pumpPlayer(dt); spring(P,P.tx,P.ty,dt); emitBubbles(P,'#39ff14',dt);   // green player propulsion
  P.bank += (clamp(P.vx/190,-1,1)-P.bank)*Math.min(1,7*dt);

  // meter climb (campaign only — base stays pinned RED, bonus has no military response)
  // RURAL maps build the meter for tension but CAP below RED (never the onslaught); urban/beltway/military fill to RED.
  if(mode==='campaign'){ var mFill = L.aa?1.05 : L.red?1.35 : 0.5; meter = clamp(meter + dt*mFill, 0, ons?100:64); }   // red maps fill fast enough to reach the RED climax within their clock

  // THE RUN — once past the zone's scroll_start the world drags you back; beaming anchors you
  var worldSpeed = 0;   // HOLD the area — work one spot for the calm part of the clock; it only moves on THE RUN
  if(mode==='campaign' && elapsed>=L.scrollStart){
    if(!runActive){ runActive=true; flash('>>> THE RUN <<<','#ff9d3a',1.4); sfx('run',0.5); }
    var ramp=clamp((elapsed-L.scrollStart)/Math.max(1,levelLen-L.scrollStart),0,1);
    worldSpeed = 10 + 52*ramp;                                                     // gentler push (was 16 + 90)
    if(!planting && P.stun<=0) P.tx=clamp(P.tx-(14+40*ramp)*dt, W*0.05, W*0.95);   // softer drag toward the back edge
  }
  // scenery scrolls left (the world comes at you), wrapping
  for(var i=0;i<scenery.length;i++){ scenery[i].x-=worldSpeed*dt; if(scenery[i].x<-W*0.12) scenery[i].x+=W*1.24; }
  // STOP-AND-GO, and the two lanes are out of phase so the road is never uniform. Both keep a floor of
  // 0.3 so neither ever freezes (a frozen band was a real bug once) -- they crawl, then surge.
  var flowA=0.30+0.70*ease01(Math.sin(clock*0.23)*0.5+0.5);
  var flowB=0.30+0.70*ease01(Math.sin(clock*0.19+2.4)*0.5+0.5);
  bandScroll  += (worldSpeed + 58)*flowA*dt;                    // FAR lane: with the world push during THE RUN
  bandScroll2 += 52*flowB*dt;                                   // NEAR lane: oncoming, its own pace
  roadScroll += worldSpeed*dt;                                 // the asphalt only moves as fast as the world does — so the cars now drive ALONG it

  // MO (Dairy Flats only)
  if(mode==='campaign' && L.mo){
    if(!moTele && elapsed>=MO_TELE){ moTele=true; flash("DR. L: the herd's gone quiet — the FIRST one is coming back…",'#bdf2cf',2.0); }
    if(!moSpawned && elapsed>=MO_APPEAR){ moSpawned=true; spawnMo(); }
    if(moTarget && !moTarget.gone && clock>=moEscapeAt){ moTarget.gone=true; moTarget.respawn=1e9; flash(MO_ESCAPED,'#bdf2cf',2.2); moTarget=null; }   // Mo escapes ungrabbed

  /* PLAYER vs RIVAL: WARBLE phases you THROUGH the other UFO (whip to its far side);

  if(R && mode!=='base' && P.stun<=0 && R.stun<=0){

    // the beam hangs BELOW the emitter (belly->ground), NOT above it — so you can fly OVER a beaming
    // rival. Only block when the passer is at/below the emitter's belly (in the shaft), never above it.
    var vg=SAUCER_W()*0.15;                             // small grace so a clean pass-over reads
    // COMMITTED-CATCH IMMUNITY. The barrier exists to stop you flying THROUGH a live beam. It was also
    // evicting a saucer that had already parked and started lifting: whoever got HIGHER could shove the
    // other off its own catch (the shove moves .x AND .tx, which breaks the lock), grab the drop, and be
    // shoved off in turn -- the endless up/down/up/down. A saucer already lifting something is committed
    // and cannot be pushed off it; a saucer merely flying through still is. Both locks are last frame's
    // (they are cleared just below), which is what we want: it takes real committed progress to be immune.
    var pHold = !!(P.lock && P.lock.lock>0 && !P.lock.gone);
    var rHold = !!(R.lock && R.lock.lock>0 && !R.lock.gone);
    if(R.beamOn && !warbling() && !pHold && Math.abs(P.x-R.x)<bw && P.y>R.y-vg){ P.x=(P.x<=R.x)?clamp(R.x-bw,W*0.05,W*0.95):clamp(R.x+bw,W*0.05,W*0.95); P.tx=P.x; }
    if(planting && !warblingS(R) && !rHold && Math.abs(R.x-P.x)<bw && R.y>P.y-vg){ R.x=(R.x<=P.x)?clamp(P.x-bw,W*0.05,W*0.95):clamp(P.x+bw,W*0.05,W*0.95); }

  if(planting && P.stun<=0 && mode!=='base'){
    var bestD=(superT>0?W*0.11:W*0.06); for(var i=0;i<targets.length;i++){ var c=targets[i]; if(c.gone||c.hidden||c.protect) continue; var dxp=Math.abs(c.x-P.x);   // SUPER BEAM = wider acquisition; hidden critters + protected defenders aren't lockable

    if(c.hideT!==undefined && !c.lifting){ c.hideT-=dt; if(c.hideT<=0){ c.hidden=!c.hidden; c.hideT=c.hidden?rnd(2,3.2):rnd(3,4.5); } }   // hide & emerge cycle (military levels)

  } }

  updateTruck(dt);

  /* shots */

    if(sh.kind==='rocket' && chance(0.7)) addFx(sh.x,sh.y,'smoke','#c9b0a0',0.4);   // rocket exhaust trail
    if(sh.kind==='missile' && !sh.harmless){ var mt=sh.tgt||P, dx=mt.x-sh.x, dy=mt.y-sh.y, L4=Math.hypot(dx,dy)||1, turn=160;   // home on the ship it was fired at (either invader)

// One lane of the strip. Each tile takes a stable PHASE into the art so a 6-car strip stops looping:
// County Road 9 fits only ~1.4 strips on screen and 3 of its 6 vehicles are near-identical white-door
// units, so a fixed order read as clones. The phase is hashed off the ABSOLUTE tile index, not the
// scroll modulo, so a stretch of road keeps its cars as it scrolls instead of popping when a tile recycles.
// The source art FACES RIGHT (taillight at the left edge, headlight and windscreen rake at the right --
// checked against the strip, not assumed). A lane therefore flips only when it TRAVELS LEFT, and every
// car in it flips together: facing is a property of the lane, never of the individual car. Flipping per
// car -- which is what an earlier pass here did off the tile hash -- just puts cars in reverse.

function funnelHalf(own,y){ var w=SAUCER_W(), gy=groundY()+8, belly=own.y+w*0.16;
  var f=clamp((y-belly)/Math.max(1,gy-belly),0,1);                 // 0 at the emitter -> 1 at the ground

  ctx.textAlign='center'; ctx.fillStyle='#dff7e4'; ctx.font='700 17px system-ui'; ctx.fillText(sub,W/2,H*0.40+78);
  if(state!=='title'){ ctx.fillStyle='#9c89c4'; ctx.font='800 24px system-ui'; ctx.fillText('SCORE  '+score,W/2,H*0.40+118); }
}
// STAGE-CLEAR CARD — the "where you're at" beat between campaign segments (drawn over the frozen field).
function drawResult(){
  ctx.fillStyle='rgba(2,6,12,.80)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  var accent = resKind==='bonus' ? (resPerfect?'#ffd23f':'#9affc0') : '#9affc0';
  var head = resKind==='base' ? 'MILITARY BASE — CLEARED'
           : resKind==='bonus' ? (resPerfect?'PERFECT SWEEP!':'SWEEP OVER')
           : ((LEVELS[level]&&LEVELS[level].zone)||'ZONE')+' — CLEARED';
  ctx.save(); ctx.fillStyle=accent; ctx.font='900 '+clamp(W*0.05,34,72)+'px system-ui';
  ctx.shadowColor=accent; ctx.shadowBlur=24; ctx.fillText(head, W/2, H*0.24); ctx.shadowBlur=0; ctx.restore();
  var showRival=(R||twoP);
  if(resKind==='round' && showRival){ var rr=score>rivalScore?'▲ ROUND TO YOU':score<rivalScore?'▼ ROUND TO RIVAL':'— DEAD HEAT —';
    ctx.fillStyle=score>rivalScore?'#39ff14':score<rivalScore?'#3cc8ff':'#dff7e4'; ctx.font='800 '+clamp(W*0.02,14,22)+'px system-ui'; ctx.fillText(rr, W/2, H*0.24+clamp(W*0.032,22,36)); }
  var y=H*0.42, gap=clamp(W*0.04,26,48), lx=W*0.33, rx=W*0.67;
  function row(label,val,col){ ctx.textAlign='left'; ctx.fillStyle='#9fb8d0'; ctx.font='700 '+clamp(W*0.017,12,18)+'px ui-monospace'; ctx.fillText(label, lx, y);
    ctx.textAlign='right'; ctx.fillStyle=col||'#dff7e4'; ctx.font='800 '+clamp(W*0.024,16,26)+'px system-ui'; ctx.fillText(val, rx, y); y+=gap; ctx.textAlign='center'; }
  row('STAGE BONUS', '+'+resBonus, '#ffd23f');
  if(showRival){ row(twoP?'P1 SCORE':'YOUR SCORE', ''+score, '#39ff14'); row(twoP?'P2 SCORE':'RIVAL SCORE', ''+rivalScore, '#3cc8ff'); }
  else row('SCORE', ''+score, '#dff7e4');
  var shipStr = lives>6 ? ('◆ ×'+lives) : (function(){ var s=''; for(var h=0;h<Math.max(0,lives);h++) s+='◆ '; return s.trim()||'—'; })();
  row('SHIPS LEFT', shipStr, lives>1?'#39ff14':'#ff9d3a');
  ctx.textAlign='center'; ctx.fillStyle='#9c89c4'; ctx.font='700 '+clamp(W*0.015,11,15)+'px ui-monospace'; ctx.fillText('NEXT UP', W/2, H*0.71);
  ctx.fillStyle='#ffd23f'; ctx.font='900 '+clamp(W*0.026,17,30)+'px system-ui'; ctx.fillText(nextSegLabel(), W/2, H*0.71+clamp(W*0.032,22,38));
  var p=clamp(resT/RESULT_HOLD,0,1), bw=clamp(W*0.28,220,420), bx=W/2-bw/2, byy=H*0.85;
  ctx.fillStyle='rgba(255,255,255,.14)'; ctx.fillRect(bx,byy,bw,4); ctx.fillStyle=accent; ctx.fillRect(bx,byy,bw*p,4);
  ctx.globalAlpha=0.55+0.45*Math.abs(Math.sin(t*4)); ctx.fillStyle='#bdf2cf'; ctx.font='700 '+clamp(W*0.014,11,15)+'px ui-monospace';
  ctx.fillText('BEAM — CONTINUE', W/2, byy+22); ctx.globalAlpha=1;
}

/* ---------- loop ---------- */
var last=0;
function frame(ts){
  gpPoll();                                                         // F300 / 8BitDo / HID stick -> the key actions
  var raw=last?(ts-last)/1000:0.016; var dt=Math.min(0.033,raw); last=ts;
  fpsAcc+=raw; if(++fpsN>=15){ fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0; }
  if(DEV && SOAK>0 && !_devStageBooted){ _devStageBooted=true; devSoak(SOAK); }   // dev fuzz/soak across every mode
  if(DEV && /[?&]menu\b/.test(location.search) && state==='boot' && !_devStageBooted){ _devStageBooted=true; enterCheats(); }   // dev: jump to the CHEATS vault level-select
  if(state==='soakdone'){ ctx.fillStyle='#04080e'; ctx.fillRect(0,0,W,H); ctx.textAlign='left';
    ctx.fillStyle=__soak.ok?'#39ff14':'#ff5d6c'; ctx.font='900 34px ui-monospace';
    ctx.fillText(__soak.ok?'SOAK PASS':'SOAK FAIL', 40, 60);
    ctx.fillStyle='#bdf2cf'; ctx.font='700 18px ui-monospace';
    ctx.fillText('ticks '+__soak.ticks+'  ·  breaches '+__soak.breaches.length+'  ·  errors '+__soak.errors.length, 40, 96);
    var yy=140; ctx.fillStyle='#ffd23f'; ctx.font='600 14px ui-monospace';
    for(var _i=0;_i<Math.min(20,__soak.errors.length);_i++){ ctx.fillText('ERR '+__soak.errors[_i].slice(0,120), 40, yy); yy+=22; }
    ctx.fillStyle='#ff9d3a'; for(var _i=0;_i<Math.min(20,__soak.breaches.length);_i++){ ctx.fillText('BR  '+__soak.breaches[_i].slice(0,120), 40, yy); yy+=22; }
    requestAnimationFrame(frame); return; }
  if(DEV && !_devStageBooted){ var scr=(location.search.match(/[?&]screen=([a-z]+)/)||[])[1];   // dev: jump to a non-play screen for review (boot idents, attract demo, game-over/leaderboard)
    if(scr){ _devStageBooted=true; score=48200;
      if(scr==='boot'){ state='boot'; bootT=1.6; }
      else if(scr==='cabboot'){ state='cabboot'; bootT=1.6; }
      else if(scr==='demo'){ enterAttract(); startDemoCut(); demoClk=2.0; setDemoZone(2); }
      else if(scr==='over'){ startLevel(2); soloStage=false; hp=0; state='over'; flash('SOMETHING HAPPENED…','#ff5d6c',99); }
      else if(scr==='clear'){ startLevel(2); state='clear'; }
      else if(scr==='result'){ startCampaign(); score=48200; rivalScore=41000; lives=2; level=1; resKind='round'; resBonus=2000; resPerfect=false; resLast=false; segIdx=1; showResult(); }   // preview the between-stage tally
      else if(scr==='resultbonus'){ startCampaign(); score=52000; rivalScore=52000; lives=3; resKind='bonus'; resBonus=5000; resPerfect=true; resLast=false; segIdx=2; showResult(); }
      else if(scr==='board'){ SAVE.scores=[{n:'JOE',s:98200},{n:'DAV',s:71050},{n:'MO ',s:44300},{n:'DRL',s:22000},{n:'AAA',s:8000}]; state='board'; boardT=1.0; boardHi=0; }
      else if(scr==='initials'){ state='initials'; iniQueue=[48200]; iniChars=['A','A','A']; iniPos=0; boardHi=-1; }
    } }
  if(DEV && STAGE_PARAM && !_devStageBooted){ _devStageBooted=true;     // dev background-review boot: jump straight into a stage's play frame
    soloStage=true; score=0; rivalScore=0; hp=maxHP; lives=STARTING_LIVES; held={}; planting=false;
    twoP=/[?&]twop\b/.test(location.search); defcon=/[?&]defcon\b/.test(location.search);   // dev: review 2-player / DEFCON-1
    if(STAGE_ROUNDS[STAGE_PARAM]!=null){ segIdx=0; startLevel(STAGE_ROUNDS[STAGE_PARAM]); }
    else if(STAGE_PARAM==='base'){ startBase(true); }
    else if(STAGE_PARAM==='backyard'){ startBonus(0); }
    else if(STAGE_PARAM==='claw'){ startBonus(1); }
    else if(STAGE_PARAM==='champion'){ startBonus(2); }
    else if(STAGE_PARAM==='gunpowder'){ startGunpowder(true); }
    else { _devStageBooted=false; }
    if(_devStageBooted){ state='play'; if(STAGE_ELAPSED>0){ stageClock=Math.max(1,stageClock-STAGE_ELAPSED); }
      if(STAGE_SIM>0){ for(var _s=0; _s<STAGE_SIM*60 && state==='play'; _s++){ if(BOTPLAY) devBot(); update(1/60); } }   // deterministic fast-forward into live combat (BOTPLAY = best-case auto-player, for winnability tests)
      if(STAGE_LIFT>=0) devStageLift(STAGE_LIFT);                    // stage a frozen abduction for the lift-art review
    }
  }
  if(state==='boot'){ bootT+=dt; drawBoot(); audioDirector(); updateAudio(dt); updateMixPanel(dt); if(bootT>3.6){ bootT=0; state='cabboot'; } requestAnimationFrame(frame); return; }
  if(state==='cabboot'){ bootT+=dt; drawCabBoot(); audioDirector(); updateAudio(dt); updateMixPanel(dt); if(bootT>3.0){ ARCADE?enterAttract():enterFront(); } requestAnimationFrame(frame); return; }
  clock+=dt;
  if(!(DEV&&FREEZE)) update(dt);
  audioDirector(); updateAudio(dt); updateMixPanel(dt);             // bed per state/zone + crossfade
  if(state==='select' && idleT>22) enterAttract();                  // attract kicks in after idle on the menu
  if(state==='over' && idleT>12) finishRun();                        // idle on game-over -> leaderboard (or vault for solo stages)
  if(state==='clear' && idleT>12) backToFront();
  if(state==='attract'){                                                          // THE SUCK UP FILES — the real baked reel + live NEW-game demo cuts, mounted on the bezel
    ctx.fillStyle='#04080e'; ctx.fillRect(0,0,W,H);
    var sd=Math.min(W,H), ox=(W-sd)/2, oy=(H-sd)/2;
    if(attractMode==='demo'){
      ctx.save(); ctx.beginPath(); ctx.rect(ox,oy,sd,sd); ctx.clip(); ctx.translate(ox,oy);
      var RW=W,RH=H; W=sd; H=sd; drawDemoCut(); W=RW; H=RH; ctx.restore();
    } else if(reelVid && reelVid.readyState>=2){ try{ ctx.drawImage(reelVid, ox, oy, sd, sd); }catch(e){}
      if(attractClk<0.5 && ok('tjglitch')){ var g=IMG['tjglitch'], gh=g.naturalHeight*sd/g.naturalWidth, ga=1-attractClk/0.5;   // glitch back INTO the reel
        ctx.save(); ctx.globalAlpha=0.6*ga; for(var k=0;k<3;k++){ var yo=oy+((t*1500+k*gh)%(sd+gh))-gh; ctx.drawImage(g,ox,yo,sd,gh); } ctx.restore(); }
    } else { ctx.textAlign='center'; ctx.fillStyle='#9affc0'; ctx.font='700 16px ui-monospace'; ctx.fillText('THE SUCK UP FILES …', W/2, H/2); }
    ctx.save(); ctx.globalAlpha=0.55; ctx.strokeStyle=CAB_ACCENT; ctx.lineWidth=6; roundRect(ox-3,oy-3,sd+6,sd+6,12); ctx.stroke(); ctx.restore();
    if(!OG && defconArmed){ ctx.save(); ctx.textAlign='center'; var by=oy+sd*0.86;       // DEFCON 1 armed by WARBLE at coin-up (ARCADE + STANDALONE both show it)
      ctx.fillStyle='rgba(0,0,0,0.62)'; ctx.fillRect(ox, by-26, sd, 46);
      ctx.font='800 20px ui-monospace'; ctx.fillStyle=(Math.floor(t*3)%2)?'#ff5d6c':'#ffd23f';
      ctx.fillText('★ DEFCON 1 ARMED — 1 CREDIT, NO CONTINUES ★', W/2, by);
      ctx.font='600 12px ui-monospace'; ctx.fillStyle='#bdf2cf';
      ctx.fillText('BEAM = START   ·   WARBLE = STAND DOWN', W/2, by+18); ctx.restore(); }
    requestAnimationFrame(frame); return;
  }
  if(state==='ending'){ drawEnding(); requestAnimationFrame(frame); return; }
  if(state==='lockin'){ drawLockin(); drawBezel(); requestAnimationFrame(frame); return; }
  if(state==='initials'){ drawInitials(); drawBezel(); requestAnimationFrame(frame); return; }
  if(state==='board'){ drawBoard(); drawBezel(); requestAnimationFrame(frame); return; }
  if(state==='select'){ drawSelect(); drawBezel(); requestAnimationFrame(frame); return; }
  ctx.save(); if(shake>0) ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  drawBG();
  if(!(DEV&&BGONLY)){ drawTruck(); drawTargets(true); drawShots(); drawJets(); drawSaucer(); drawLifted(); drawFx(); drawHUD(); }   // &bgonly = scenery only (dev background review)
  ctx.restore();
  drawBezel();
  if(state==='over') overlay(defcon?'DEFCON 1 — GAME OVER':'GAME OVER',
      (defcon&&!defconUnlimited)?'1 CREDIT, NO CONTINUES — BEAM returns  (score '+score+')'
      : soloStage?'BEAM = back to the CHEATS vault  (score '+score+')'
      : 'INSERT COIN — CONTINUE  (score '+score+')','#ff5d6c');
  else if(state==='clear') overlay(mode==='gunpowder'?(gpFell?'GUNPOWDER FELL':'BASE HELD'):mode==='base'?'BASE CLEARED':soloStage?'STAGE CLEARED':'YOU MADE IT HOME', ARCADE?'press any key — THE SUCK UP FILES':'BEAM = back to the cab menu',gpFell&&mode==='gunpowder'?'#ff5d6c':'#9affc0');
  else if(state==='result') drawResult();
  requestAnimationFrame(frame);
}
// HEADLESS SHOT HOOK (dev-only): ?shot=<zone>&ticks=N boots straight into a zone for a screenshot.
// Zones: dairy/corn/downtown/county/beltway/outskirts/base. Used to review scenery art headlessly.
var SHOTZ=(location.search.match(/[?&]shot=([a-z]+)/)||[])[1];
if(SHOTZ){
  var _ZI={dairy:0,corn:1,downtown:2,county:3,beltway:4,outskirts:5};
  if(SHOTZ==='base') startBase(true); else startLevel(_ZI[SHOTZ]!=null?_ZI[SHOTZ]:2);
  var _TK=parseInt((location.search.match(/[?&]ticks=(\d+)/)||[])[1]||'90',10);
  for(var _s=0;_s<_TK;_s++) update(1/60);                    // pre-advance so scroll/spawns settle
  msg=''; msgT=0; pendBarkAt=0;                              // clean plate (no zone-flash / queued bark)
}
// HEADLESS SOAK HOOK (dev-only): ?soak exposes window.__soak(N, defcon) — drives the engine through N
// full arcade runs with hostile random input, asserting invariants each tick; returns a JSON report.
if(/[?&]soak\b/.test(location.search)){
  window.__soak=function(n, sd){
    var breaches=[], errs=[], totalTicks=0, done=0, scores=[], maxEnt={t:0,j:0,s:0,f:0}, ended={over:0,ending:0,cap:0}, MAXT=45000;   // cover a full 9-segment run
    function chk(r,t){
      if(!(meter>=-0.01&&meter<=100.01)) breaches.push('meter='+(+meter).toFixed(1)+' r'+r+' t'+t);
      if(!isFinite(P.x)||!isFinite(P.y)) breaches.push('P nonfinite r'+r+' t'+t);
      if(R&&(!isFinite(R.x)||!isFinite(R.y))) breaches.push('R nonfinite r'+r);
      if(!(lives>=-1&&lives<=99)) breaches.push('lives='+lives+' r'+r);
      if(targets.length>60) breaches.push('targets='+targets.length+' r'+r);
      if(jets.length>40) breaches.push('jets='+jets.length+' r'+r);
      if(shots.length>300) breaches.push('shots='+shots.length+' r'+r);
      if(fx.length>600) breaches.push('fx='+fx.length+' r'+r);
      if(!isFinite(stageClock)) breaches.push('stageClock nonfinite r'+r);
      if(segIdx<0||segIdx>SCHEDULE.length) breaches.push('segIdx='+segIdx+' r'+r);
      if(targets.length>maxEnt.t)maxEnt.t=targets.length; if(jets.length>maxEnt.j)maxEnt.j=jets.length;
      if(shots.length>maxEnt.s)maxEnt.s=shots.length; if(fx.length>maxEnt.f)maxEnt.f=fx.length;
    }
    for(var r=0;r<n;r++){
      var seed=((r+1)*2654435761)>>>0, rng=function(){ seed=(seed*1103515245+12345)>>>0; return seed/4294967296; };
      try{
        twoP=false; defconArmed=!!sd; startCampaign();
        var t=0;
        while(state==='play' && t<MAXT){
          held.left=rng()<0.4; held.right=rng()<0.4; held.up=rng()<0.3; held.down=rng()<0.3; planting=rng()<0.5;
          if(rng()<0.03 && P && clock>P.warbleCd){ P.warbleU=clock+0.6; P.warbleCd=clock+2; }
          update(1/60); t++; totalTicks++; chk(r,t); if(breaches.length>40) break;
        }
        if(state==='over')ended.over++; else if(state==='ending')ended.ending++; else if(t>=MAXT)ended.cap++;
        scores.push(score||0); done++;
      }catch(e){ errs.push('r'+r+': '+(e&&e.message||(''+e))); }
      if(errs.length>15||breaches.length>40) break;
    }
    var avg=scores.length?Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length):0;
    return JSON.stringify({N:n,defcon:!!sd,done:done,totalTicks:totalTicks,ended:ended,breachCount:breaches.length,
      breaches:breaches.slice(0,15),errCount:errs.length,errs:errs.slice(0,15),avgScore:avg,maxScore:scores.length?Math.max.apply(null,scores):0,peakEntities:maxEnt});
  };
}
requestAnimationFrame(frame);
})();
