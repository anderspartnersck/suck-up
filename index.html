<!--
  SUCK UP — AIRY CUT — STANDALONE, PLAYABLE browser feel-build. A sandbox, NOT the
  game: it never imports or modifies suck_up.py. The canonical Python engine stays
  the source of truth (balance + determinism + break gates). This exists to PLAY
  the render-only air-cushion GLIDE in real combat, at full sprite size.

  This cut now ports ALL SIX ZONES — the old model's exact run, Dairy Flats through the
  Outskirts: real names, clocks, scenery, spawn flavor (person_bias), starting Military
  Response (meter0), RUSH goals, AA-from-start, THE RUN scroll_start, and MO the Dairy
  Flats boss — values lifted from src/suck_up.py ROUNDS. It is a faithful REPRESENTATION
  of the levels' content/feel, not a byte-exact engine port (that'd fork the engine).
  Scenery + ground sprites are HEIGHT-keyed (sz()/scnH(), bottom-anchored) so tall/short
  silhouettes read in proportion at any width.

  Opens on the CASTLE KILLSCREEN ident (the house boot), then the title.
  Render rule: the saucer TARGET snaps on a grid like move_player(); the DRAWN saucer
  springs toward it (clamped, never past) so grid-jitter disappears and it flies.
-->

function ok(n){ var im=IMG[n]; return im&&im.ok; }
function drawImg(n,x,y,w,rot,alpha,flip,smooth){
  var im=IMG[n]; if(!im||!im.ok) return false;
  var ar=im.naturalWidth/im.naturalHeight, h=w/ar;
  ctx.save(); ctx.globalAlpha=alpha==null?1:alpha; ctx.imageSmoothingEnabled=smooth!==false;
  if(ctx.imageSmoothingEnabled) ctx.imageSmoothingQuality='high';   // better resample = no shimmer on slow zooms (Ken Burns)
  ctx.translate(x,y); if(rot) ctx.rotate(rot); if(flip) ctx.scale(-1,1);
  ctx.drawImage(im,-w/2,-h/2,w,h); ctx.restore(); return true;
}
// KEN BURNS anti-shimmer: pre-scale a big image ONCE into an offscreen canvas near its display
// height, so the per-frame zoom is only a gentle downscale (no crawling on high-detail edges like
// the cab bezel). Rebuilt only when the target size drifts (or on resize).
var _kb={};
function kenScaled(name, dispH){
  var im=IMG[name]; if(!im||!im.ok) return null;
  var tH=Math.max(2,Math.ceil(dispH)), c=_kb[name];
  if(!c || Math.abs(c.h-tH) > tH*0.12){
    var tW=Math.max(2,Math.round(tH*(im.naturalWidth/im.naturalHeight)));
    var off=document.createElement('canvas'); off.width=tW; off.height=tH;
    var octx=off.getContext('2d'); octx.imageSmoothingEnabled=true; octx.imageSmoothingQuality='high';
    octx.drawImage(im,0,0,tW,tH); c=_kb[name]={cv:off,w:tW,h:tH};
  }
  return c;
}

/* ---------- glide (air cushion) ---------- */
var GLIDE=true, accel=210, damp=27;
function spring(o,tx,ty,dt){
  if(!GLIDE){ o.x=tx; o.y=ty; o.vx=o.vy=0; return; }
  var ox=o.x, oy=o.y;
  o.vx += ((tx-o.x)*accel - o.vx*damp)*dt;
  o.vy += ((ty-o.y)*accel - o.vy*damp)*dt;
  o.x += o.vx*dt; o.y += o.vy*dt;
  if((tx-ox)*(tx-o.x)<0){ o.x=tx; o.vx=0; }     // never coast past the target
  if((ty-oy)*(ty-o.y)<0){ o.y=ty; o.vy=0; }
}

function countKind(k){ var n=0; for(var i=0;i<targets.length;i++) if(!targets[i].gone && targets[i].kind===k) n++; return n; }
function pickKind(pb){
  if(Math.random()<0.025) return 'repair';     // rare HULL-restore pickup (the original's REPAIR freak-spawn)
  var mil=[0,0.06,0.14,0.20][stageOf()];      // military vehicles only once the heat is on — GREEN = NONE (original mil_chance per stage)
  var person=clamp(0.24+pb,0.05,0.70), r=Math.random();
  if(r<mil) return 'tank';                     // no tanks in the calm (GREEN) opening — they ramp with the meter
  if(r<mil+person) return 'person';
  if(r<mil+person+0.08) return 'brisket';
  if(r<mil+person+0.18) return 'farmer';
  return 'cow';
}
function pickSpawnKind(){ var L=LEVELS[level], urban=(mode==='campaign'&&L&&L.urban);
  var k=pickKind(curBias()); if(k==='tank' && (countKind('tank')>=2 || !onslaughtMap())) k=urban?'person':'cow';   // vehicles cap at 2, ONLY on onslaught maps
  if(urban){ if(k==='cow') k='person'; else if(k==='farmer') k='soldier'; }   // URBAN: no cows in the city — civilians + soldiers
  return k; }
function spawnTarget(kind){

}

// ARCADE 1UP (locked cab build): the coin-eater — always from the top, no save. UNCHANGED.
function startCampaign(){ story=false; defconUnlimited=false; defcon=defconArmed; defconArmed=false; soloStage=false; score=0; rivalScore=0; nextExtra=EXTRA_LIFE; superT=0; briskN=0; hp=maxHP; lives=STARTING_LIVES; clock=0; segIdx=0; held={}; planting=false; applyCodes(); beginSegment(); }
// STANDALONE / STORY (blacksite): plays like the arcade run but SAVES — a normal coin CONTINUES from your
// furthest zone; a WARBLE-armed coin is the DEFCON-1 challenge from the top (clear it -> unlock the CHEATS vault).
function startStory(){ story=true; defconUnlimited=false; defcon=defconArmed; defconArmed=false; soloStage=false; score=0; rivalScore=0; nextExtra=EXTRA_LIFE; superT=0; briskN=0; hp=maxHP; lives=STARTING_LIVES; clock=0; held={}; planting=false;
  var z = (defcon || SAVE.beat) ? 0 : storyMaxZone();      // DEFCON run + an already-finished game restart at the top; otherwise resume your furthest zone
  segIdx = schedIdxOfZone(z); applyCodes(); beginSegment(); }
function schedIdxOfZone(z){ var r=0; for(var i=0;i<SCHEDULE.length;i++){ if(SCHEDULE[i]==='R'){ if(r===z) return i; r++; } } return 0; }
function zoneOfSeg(si){ if(SCHEDULE[si]!=='R') return -1; var r=0; for(var i=0;i<si;i++) if(SCHEDULE[i]==='R') r++; return r; }
// CONTINUE (quarter-eater): drop another credit — fresh lives/hull, resume the CURRENT stage, score carries.
function insertContinue(){ hp=maxHP; lives=STARTING_LIVES; held={}; planting=false; sfx('launch',0.6); beginSegment(); }
// Walk the old model's schedule: 'R' -> the next zone, 'B' -> bonus sweep, 'M' -> base.
function beginSegment(){
  var seg=SCHEDULE[segIdx];
  if(seg==='R'){ var ri=0; for(var i=0;i<segIdx;i++) if(SCHEDULE[i]==='R') ri++; startLevel(ri); }
  else if(seg==='M'){ startBase(false); }
  else { var bi=0; for(var i=0;i<segIdx;i++) if(SCHEDULE[i]==='B') bi++; startBonus(bi); }
}
function advanceSegment(){
  sfx('transition',0.55);
  if(soloStage){ state='clear'; return; }                 // single stage off the CHEATS vault -> back to the cab
  var z=zoneOfSeg(segIdx); if(z>=0 && z+1<LEVELS.length && z+1>(SAVE.storyMax|0)){ SAVE.storyMax=z+1; persist(); }   // clearing a zone unlocks the next (STANDALONE/STORY progress)
  resLast=(segIdx+1>=SCHEDULE.length);                    // final segment -> the card leads into the credit page
  showResult();                                           // the "where you're at" beat, THEN proceedSegment() picks up the schedule
}
// dismiss of the stage-clear card -> resume the schedule (or roll credits after the last segment)
function proceedSegment(){ if(resLast){ endRun(); return; } segIdx++; beginSegment(); }
// label of the segment we're ABOUT to play (shown as "NEXT UP" on the clear card)
function nextSegLabel(){ if(resLast) return 'THE END';
  var seg=SCHEDULE[segIdx+1];
  if(seg==='M') return 'THE MILITARY BASE';
  if(seg==='B'){ var bi=0; for(var i=0;i<=segIdx;i++) if(SCHEDULE[i]==='B') bi++; return (bi%2===1?"DAVE'S BACKYARD":'CLAW & ORDER')+' — BONUS'; }
  var ri=0; for(var i=0;i<=segIdx;i++) if(SCHEDULE[i]==='R') ri++;                    // rounds cleared so far -> next zone index
  var LN=LEVELS[ri]; return LN?('ZONE '+(ri+1)+' — '+LN.zone):'THE NEXT ZONE'; }
function showResult(){ state='result'; resT=0; idleT=0; msg=''; msgT=0; held={}; held2={}; planting=false; planting2=false; }   // clear the transient clear-flash so the card owns the headline
function endRun(){ state='ending'; endT=0; SAVE.beat=true;
  if(defcon && !defconUnlimited && !SAVE.cheats){ SAVE.cheats=true; unlockMsg='CHEATS UNLOCKED'; }   // beat the run on REAL DEFCON 1 -> the CHEATS vault opens
  persist();
}

function launchSel(){ var m=MENU[sel]; held={}; planting=false;
  if(m.kind==='locked'||m.kind==='header'){ if(m.kind==='locked'){ sfx('denied',0.45); flash(m.hint||'LOCKED','#ff5d6c',1.0); } return; }
  if(m.kind==='god'){ GOD=!GOD; sfx(GOD?'pickup':'denied',0.6); flash('THEORISTS SAY '+(GOD?'YES':'NO'), GOD?'#39ff14':'#ff9d3a',0.9); return; }
  if(m.kind==='code'){ var on=toggleCode(m.code), cd=null; for(var ci=0;ci<CODES.length;ci++) if(CODES[ci].c===m.code) cd=CODES[ci];
    sfx(on?'snatch':'denied',0.6); flash(m.code+' — '+(on?'ON · '+cd.eff:'OFF'), on?'#ffd23f':'#ff9d3a',1.3); return; }
  nextExtra=EXTRA_LIFE; superT=0; briskN=0;              // fresh vault stage: don't inherit extra-life threshold / super charge from a prior run
  if(m.kind==='round'){ score=0; rivalScore=0; hp=maxHP; lives=STARTING_LIVES; soloStage=true; segIdx=0; applyCodes(); startLevel(m.idx); }
  else if(m.kind==='base'){ score=0; rivalScore=0; lives=STARTING_LIVES; soloStage=true; startBase(true); applyCodes(); }   // applyCodes AFTER startBase — startBase zeroes score, so AVRVM's +50k must land last
  else if(m.kind==='bonus'){ score=0; rivalScore=0; hp=maxHP; lives=STARTING_LIVES; soloStage=true; applyCodes(); startBonus(m.idx); }
  else if(m.kind==='gunpowder'){ score=0; rivalScore=0; hp=maxHP; lives=STARTING_LIVES; soloStage=true; startGunpowder(true); applyCodes(); }
  else if(m.kind==='all'){ startCampaign(); }
  else if(m.kind==='defcon'){ defconArmed=true; startCampaign(); defconUnlimited=true; }   // DEFCON-1 practice: real hazards, but continues allowed
  else if(m.kind==='watch'){ attractMute=false; enterAttract(); }
  else if(m.kind==='watchmute'){ enterAttract(); attractMute=true; }   // silent attract loop
}

// one demo saucer acquires + lifts its own cow (the new 2-UFO game, self-playing)
function demoBeam(d,dt,col){
  d.beamT-=dt;
  if(!d.cow){ if(d.beamT<=0){ var best=null,bd=W*0.07; for(var i=0;i<targets.length;i++){ var c=targets[i]; if(c.gone||c.owner)continue; var dd=Math.abs(c.x-d.x); if(dd<bd){bd=dd;best=c;} } if(best){ d.cow=best; best.owner=d; } else d.beamT=0.5; } }
  else { var c=d.cow; if(c.gone||c.owner!==d){ d.cow=null; } else { c.lifting=true; c.lock=clamp(c.lock+dt/1.1,0,1);
    if(c.lock>=1){ addFx(d.x,d.y,'snatch',col,0.5); sfxT('snatch',0.5,0.35); sfxT('cow',0.6,0.3); c.gone=true; c.respawnA=rnd(1.4,3); c.lifting=false; c.lock=0; c.owner=null; d.cow=null; d.beamT=rnd(1.2,2.6); } } }
}
function updateAttract(dt){ var _W=W,_H=H; W=H=Math.min(_W,_H);     // square space — matches the letterboxed draw
  attractT+=dt; podT+=dt; if(podT>=PODS[podIdx].sec){ podT=0; podIdx=(podIdx+1)%PODS.length; }
  if(msgT>0)msgT-=dt;
  for(var jx=jets.length-1;jx>=0;jx--){ var je=jets[jx];
    if(je.disabled){ je.spinT+=dt; je.x+=je.vx*dt; je.vy-=70*dt; je.y+=je.vy*dt; je.scale=Math.max(0,je.scale-dt*0.55); je.bank+=dt*16;   // EMP'd: tumble into the distance + shrink
      if(je.spinT>1.7 || je.scale<=0.18 || je.y<band().top-H*0.25){ addFx(je.x,je.y,'spark','#ffb066',0.45); addFx(je.x,je.y,'snatch','#9affc0',0.4); jets.splice(jx,1); } continue; }
    je.x+=je.vx*dt; je.y=je.base+Math.sin(t*je.spd+je.phase)*je.amp;   // cosmetic planes loop the menace (t advances in attract)
    je.bank+=(clamp(je.vy/200,-1,1)-je.bank)*Math.min(1,7*dt);
    if((demo.cow && Math.abs(je.x-demo.x)<SAUCER_W()*0.45 && je.y>demo.y) ||                  // a plane crossing a beaming UFO's column gets EMP'd
       (demo2.cow && Math.abs(je.x-demo2.x)<SAUCER_W()*0.45 && je.y>demo2.y)){ disableJet(je); continue; }

// ---- damage ----
function gpHurt(d,amt,kind,quiet,src){
  if(!d || d.gone || d.vanish>0 || d.aboard || d.dkind==='evac' || d.dkind==='banner') return;
  if(gpIsPerson(d)){
    var cov=gpCovered(d), m = kind==='direct'?(cov?GP_SOLDIER.cover:1) : kind==='blast'?(cov?0.6:1) : kind==='fire'?(cov?0.75:1) : 1;
    d.hp-=amt*m; if(gpStats){ var sk2=src||kind; gpStats.dmg[sk2]=(gpStats.dmg[sk2]||0)+amt*m; } if(!quiet){ d.hitT=0.18; addFx(d.x+rnd(-4,4), gpBodyY(d,0.55), 'spark', '#ff5d6c', 0.25); }
    if(d.hp<=0){
      if(d.dkind!=='civilian' && d.st!=='wounded'){ d.st='wounded'; d.hp=1.5; d.patchT=0; d.burnT=0; gpStats.wounded++;
        flash((d.dkind==='officer'?'THE CO IS HIT':'SOLDIER WOUNDED')+' — FALLING BACK TO THE AID POST','#ff9d3a',1.1); sfxT('hit',0.3,0.3); }
      else { d.hp=0; d.vanish=GNOME_VANISH; if(d.dkind==='civilian') gpStats.lostC++; else gpStats.lostS++; gpStats.lostAt.push(Math.round(gpEl())+(d.dkind==='civilian'?'c':'s')+':'+(src||kind));
        var o=gpCounts(), left=o.alive-1; shake=Math.max(shake,7); sfxT('denied',0.3,0.4);
        flash((d.dkind==='civilian'?'A CIVILIAN IS DOWN':d.dkind==='officer'?'THE CO IS DOWN':'A SOLDIER IS DOWN')+' — '+left+' LEFT · MUST SAVE '+GP_MUST_SAVE, left<=GP_MUST_SAVE?'#ff5d6c':'#ff9d3a',1.6); }
    }
    return; }
  // structures: gate / cover / the AA gun
  if(d.hp<=0) return;
  d.hp-=amt*(kind==='melee'?0.75:kind==='fire'?0.8:1); d.hitT=0.15;
  if(d.hp<=0){ d.hp=0; d.wrecked=true; d.wreckRot=rnd(-0.12,0.12); shake=Math.max(shake,9); sfxT('hit',0.2,0.45);
    for(var k=0;k<3;k++) addFx(d.x+rnd(-20,20), gpBodyY(d,0.5)+rnd(-8,8), 'boom', '#ff7a3a', 0.6);
    if(d===gpGate){ flash('THE GATE IS DOWN!','#ff5d6c',1.6); }
    else if(!d.captured) flash((d.aa?'THE AA GUN':d.sprite==='gp_vehicle'?'THE HUMVEE':'THE SANDBAGS')+' — DESTROYED','#ff9d3a',1.1); }
}
function gpBlast(x,r,dmg,sdmg,kind,src){
  for(var i=0;i<targets.length;i++){ var c=targets[i]; if(c.gone || c.kind!=='defender') continue;
    var dx=Math.abs(c.x-x), reach=r+(c.dkind==='cover'||c.dkind==='gate'?gpHalfW(c)*0.6:0);
    if(dx<reach) gpHurt(c, gpIsPerson(c)?dmg*(1-0.5*dx/Math.max(1,reach)):sdmg, kind||'blast', false, src); }
  addFx(x, groundY()-8, 'boom', '#ff9d3a', 0.6); addFx(x, groundY()-14, 'smoke', '#9aa', 0.8); shake=Math.max(shake,5); sfxT('hit',0.18,0.32);
}
function gpHurtGnome(g,dmg,fromX,src){
  if(g.gone || g.dieT>0 || g.lifting) return false;

  if(g.u.armor && src!=='aa') dmg*=g.u.armor;
  g.hp-=dmg; g.hitT=0.16; var away=(g.x>=fromX?1:-1);
  if(!g.armor) g.x=clamp(g.x+away*W*0.007, -W*0.05, W*1.1);       // KNOCKBACK — the hit reads
  addFx(g.x, gpBodyY(g,0.5), 'spark', '#ffd27a', 0.22);
  if(g.hp<=0){ g.dieT=0.7; g.protect=true; g.dieDir=away; gpStats.lineKills++; addFx(g.x, gpBodyY(g,0.4), 'snatch', '#ff9d5a', 0.35); return true; }
  return true; }
// ---- projectiles (the ground war has its OWN list: shots[] is the anti-saucer list and would hit the UFO) ----
function gpShot(kind,x0,y0,x1,y1,speed,o){ if(gpShots.length>=180) gpShots.shift();
  var d=Math.hypot(x1-x0,y1-y0), s={kind:kind,x0:x0,y0:y0,x1:x1,y1:y1,x:x0,y:y0,px:x0,py:y0,t:0,T:o&&o.T?o.T:Math.max(0.05,d/speed)};

function gpMuzzle(x,y,col){ gpFx.push({kind:'muzzle',x:x,y:y,t:0,life:0.08,col:col||'#ffe7a0'}); }
function gpUpdateShots(dt){
  for(var i=gpShots.length-1;i>=0;i--){ var s=gpShots[i]; s.px=s.x; s.py=s.y; s.t+=dt;
    if(s.kind==='hex'){                                          // the wizard's hex HOMES on the saucer — warble through it
      var dx=P.x-s.x, dy=P.y-s.y, L=Math.hypot(dx,dy)||1, sp=W*0.42; s.vx=(s.vx||dx/L*sp)*0.9+dx/L*sp*0.1; s.vy=(s.vy||dy/L*sp)*0.9+dy/L*sp*0.1;
      s.x+=s.vx*dt; s.y+=s.vy*dt; if(chance(0.5)) gpFx.push({kind:'spark2',x:s.x,y:s.y,t:0,life:0.3,col:'#b388ff'});
      if(L<SAUCER_W()*0.42){ if(warbling()){ gpFx.push({kind:'fizz',x:s.x,y:s.y,t:0,life:0.35}); sfxT('deflect',0.2,0.6); }
        else if(!GOD){ P.stun=Math.max(P.stun,0.9); planting=false; flash('HEXED! — WARBLE THROUGH WIZARD FIRE','#b388ff',1.0); sfxT('hit',0.3,0.35); addFx(P.x,P.y,'emp','#b388ff',0.45); gpAtk('hexHit'); }
        gpShots.splice(i,1); continue; }
      if(s.t>3.2){ gpShots.splice(i,1); } continue; }
    var u=clamp(s.t/s.T,0,1); s.x=s.x0+(s.x1-s.x0)*u; s.y=s.y0+(s.y1-s.y0)*u-(s.arc||0)*4*u*(1-u);
    if(s.kind==='shell' && chance(0.4)) gpFx.push({kind:'smoke',x:s.x,y:s.y,t:0,life:0.5});
    if(s.kind==='rocket' && chance(0.7)) addFx(s.x,s.y,'smoke','#c9b0a0',0.4);
    if(s.kind==='orb' && chance(0.8)) gpFx.push({kind:'spark2',x:s.x,y:s.y,t:0,life:0.35,col:'#8fd8ff'});
    if(u<1) continue;
    // arrival
    if(s.side==='us'){ if(s.tgt && gpHurtGnome(s.tgt,s.dmg,s.x0,s.src)) gpStats.soldierHits++; else if(!s.tgt) gpFx.push({kind:'dust',x:s.x1,y:groundY()+4,t:0,life:0.35}); }
    else if(s.blast){ if(s.kind==='orb'){ gpFx.push({kind:'bolt',x:s.x1,t:0,life:0.42}); sfxT('snatch',0.25,0.25); }
      gpBlast(s.x1, s.blast*W, s.dmg, s.sdmg||0, s.dk||'blast', s.src); }
    else { if(s.tgt) gpHurt(s.tgt, s.dmg, s.dk||'direct', false, s.src); else gpFx.push({kind:'dust',x:s.x1,y:groundY()+4,t:0,life:0.3}); }
    gpShots.splice(i,1); }
}

function gpSoldierTarget(c){ var best=null, bd=W*GP_SOLDIER.range, gx=W*GP_GATE_X;
  for(var i=0;i<targets.length;i++){ var g=targets[i]; if(g.gone||g.kind!=='gnome'||g.dieT>0||g.cheer||g.lifting||g.x>W*1.0) continue;

function gpBurn(c,dt){ if(c.burnT>0){ c.burnT-=dt; gpHurt(c,0.3*dt,'burn',true); if(chance(0.5)) gpFx.push({kind:'flame',x:c.x+rnd(-6,6),y:gpBodyY(c,rnd(0.2,0.8)),vx:rnd(-10,10),vy:-rnd(20,45),t:0,life:0.4,r:rnd(3,6)}); } }
function gpDefender(c,dt){

    if(c.vanish>0) return; c.fireCd-=dt; if(c.poseT>0)c.poseT-=dt; gpBurn(c,dt); if(c.vanish>0) return;

      if(Math.abs(dd)>W*0.008){ c.x+=Math.sign(dd)*W*0.028*dt; c.patchT=0; } else { c.patchT+=dt;
        if(c.patchT>8){ c.st=(c.dkind==='officer')?'post':'move'; c.hp=2; c.patchT=0; gpStats.patched++; if(c.dkind==='soldier') c.tx=gpPosts(Math.min(gpPhase,2))[(Math.random()*5)|0];
          flash('PATCHED UP — BACK ON THE LINE','#9affc0',1.0); } }
      c.sprite='gp_wounded'; c.flipX=dd<0; return; }
    if(c.dkind==='officer'){ c.sprite='gp_officer'; c.flipX=false; gpCoT-=dt; if(gpCoT<=0){ gpCoT=rnd(14,20); if(state==='play' && msgT<=0) flash(pick(GP_CO_BARKS),'#bdf2cf',1.4); } return; }
    if(c.st==='move'){ var d=c.tx-c.x; if(Math.abs(d)<W*0.004){ c.x=c.tx; c.st='post'; }
      else { c.x+=Math.sign(d)*Math.min(Math.abs(d), W*GP_SOLDIER.run*dt); c.face=Math.sign(d); c.sprite='gp_run'; c.flipX=c.face<0;
        if(c.fireCd<=0){ var tq=gpSoldierTarget(c); if(tq && Math.abs(tq.x-c.x)<W*0.12){ c.fireCd=GP_SOLDIER.cd*1.6; gpSoldierFire(c,tq); } }   // snap shots on the run

    var tg=gpSoldierTarget(c);
    if(tg){ c.face=tg.x>=c.x?1:-1; if(c.fireCd<=0){ c.fireCd=GP_SOLDIER.cd*rnd(0.8,1.25); gpSoldierFire(c,tg); } }
    c.sprite=(tg||c.poseT>0)?'gp_aim':c.idleSp; c.flipX=(c.sprite==='gp_aim')?(c.face>0):(c.face<0);
    return; }

    if(gpEvac && gpEvac.st==='load' && c.boardOrder!=null && gpEvac.loadT>=c.boardOrder*0.9){   // EVAC — run for the humvee
      var dx=gpEvac.x-c.x; if(Math.abs(dx)<W*0.012){ c.aboard=true; c.gone=true; c.respawn=1e9; gpFx.push({kind:'tele',x:c.x,y:gpBodyY(c,0.5),t:0,life:0.4,col:'#7fe9ff'});
        var o=gpCounts(); flash('CIVILIAN ABOARD — '+o.aboard+'/'+o.cT,'#7fe9ff',0.9); sfxT('pickup',0.2,0.4); return; }
      c.x+=Math.sign(dx)*W*0.06*dt; c.flipX=dx<0; return; }
    var th=null, td=W*0.075; for(var q=0;q<targets.length;q++){ var gq=targets[q]; if(gq.kind!=='gnome'||gq.gone||gq.dieT>0||gq.lifting||gq.cheer) continue; var dq=Math.abs(gq.x-c.x); if(dq<td){ td=dq; th=gq; } }
    if(th){ var away=(c.x>=th.x?1:-1); c.x=clamp(c.x+away*W*0.055*dt, W*0.02, W*0.40); c.flipX=away<0; c.fleeing=true; return; }   // a gnome on them: RUN (toward the soldiers)
    if(c.homeX==null) c.homeX=c.x; if(c.fleeing && Math.abs(c.x-c.homeX)>W*0.004){ var hd=c.homeX-c.x; c.x+=Math.sign(hd)*Math.min(Math.abs(hd),W*0.02*dt); c.flipX=hd<0; return; }
    c.fleeing=false; c.flipX=(Math.sin(clock*0.7+c.x)>0.6);        // cowering by the barracks, glancing around
    return; }
  if(c.dkind==='cover' && c.aa && c.hp>0 && !c.captured && gpPhase>=2){   // the AA gun levels its barrels at the armour

      for(var i=0;i<targets.length;i++){ var g=targets[i]; if(g.gone||g.kind!=='gnome'||g.dieT>0||g.lifting||g.cheer||g.x>W) continue;
        var pr=(g.armor||g.veh||g.u.ai==='mortar')?0.25:1, d2=Math.abs(g.x-c.x)*pr; if(d2<bd){ bd=d2; best=g; } }
      if(best){ c.fireCd=2.4; var mx=c.x+gpHalfW(c)*0.8*(best.x>c.x?1:-1), my=gpBodyY(c,0.8);
        gpShot('cannon',mx,my,best.x,gpBodyY(best,0.4),W*1.4,{side:'us',tgt:best,dmg:best.armor?2.5:2,src:'aa',col:'#ffd27a'}); gpMuzzle(mx,my,'#ffb066'); sfxT('rocket',0.3,0.25); gpAtk('aa'); }

  if(c.dkind==='evac'){
    if(c.st==='in'){ var d3=c.tx-c.x; c.x+=Math.sign(d3)*Math.min(Math.abs(d3),W*0.14*dt); c.flipX=false;
      if(Math.abs(d3)<2){ c.st='load'; c.loadT=0; var civs=gpPeople().filter(function(p){return p.dkind==='civilian';}).sort(function(a,b){return a.x-b.x;});

    else if(c.st==='load'){ c.loadT+=dt; if(gpEl()>=GP_LEN-3.5){ c.st='out'; flash('CONVOY ROLLING OUT','#7fe9ff',1.2); } }
    else if(c.st==='out'){ c.x-=W*0.16*dt; c.flipX=true; if(c.x<-W*0.12){ c.gone=true; c.respawn=1e9; } } }
}

/* ---------- CLAW & ORDER — the HOSTILE crab-feast bonus (REBUILT 2026-10-14) ----------
   Joe: "a very hostile bonus level where if you are not careful you can risk or reward." The crab house on the bay is
   mid-feast, and the dock SHOOTS BACK. How it plays (CLAW_LEN 105s, no sweep-for-PERFECT any more):
     THE HOLD    every grab goes into your HOLD, not your score. It is only yours once you BANK it at THE DROP (the
                 green ring over the water, top-left). The clock running out banks whatever you carry ("LAST CALL").
     THE STREAK  grabs chained inside CLAW_CHAIN seconds multiply: x1, x2, x3, x4. A hit, a bank or a gap breaks it —
                 so banking is insurance that COSTS you the streak.
     THE DOCK    a greed meter. Every grab raises it (val/25; the rival's thefts count half), it cools slowly, and a floor
                 creeps up with the clock. CALM -> SORE -> ANGRY -> RIOT brings more townsfolk out of the crab house
                 (they WALK out of the door / off the pier — nothing appears without warning) and faster fire.
                 Below RIOT they only shoot at THIEVES (a saucer carrying a hold or beaming their food); at RIOT they shoot
                 at anything in the sky, plus the OLD BAY BARRAGE: every gun on the dock telegraphs, then fires together.
     THE FIRE    every shot is TELEGRAPHED (CLAW_TEL ~1s: a "!" over the shooter + the aim line, aim LOCKED where you were
                 when it started — move after the "!" and it misses). Rock-salt shotgun (3-pellet fan), thrown mallets
                 (lobbed, they arc), flare gun (slow, bright). WARBLE deflects any of it; a deflected round that lands on a
                 townie knocks his hat off (RETURN TO SENDER +250, he ducks for a few seconds — no-damage, comic).
     THE RISK    the cheap stuff sits at the quiet end of the dock; the bushels / coolers / restocked platters are on the
                 crab-house porch where the guns are; THE BULL (a #1 jimmy, 2000) comes out at CLAW_BULL_AT with THE OWNER.
                 A hit costs REAL HULL (it carries into the next zone) and SPILLS a third of the hold into the bay.
     THE FAIL    hull gone = RUN OFF THE DOCK: the hold is lost, what you banked is kept, NO ship is lost, and you limp into
                 the next zone on a patched hull (CLAW_PATCH). In the arcade run there is NO retry — the gamble is the point.
                 From the CHEATS vault (practice) BEAM retries, like THE GUNPOWDER HORROR.
     BAIL        park in THE DROP with an empty hold and it counts you out: take the money and run, hull as it is.
     PERFECT     bank THE BULL without taking a single hit: +BONUS_PERFECT.
   Pure web build. The townsfolk are the painted posse sheet (twn_*: shotgun, mallet throwers, the waterman's flare, the owner)
   until the painted feast crowd lands — docs/ART_REQUESTS_1014.md §4. */
var CLAW_LEN=105, CLAW_CHAIN=4.0, CLAW_MULT_MAX=4, CLAW_SPILL=0.34, CLAW_BULL_AT=58, CLAW_BULL_VAL=2000, CLAW_PATCH=34;
var CLAW_TEL=1.0, CLAW_VOLLEY_TEL=1.25, CLAW_VOLLEY_EVERY=9.0, CLAW_RESTOCK_EVERY=8.0, CLAW_RETURN=250, CLAW_DUCK=3.5;
var CLAW_ANGER={ grab:1/22, rival:0.2, decay:1.0, floor:45, bull:100, rivalBull:30 };   // floor = where the meter can't cool below by the horn
var CLAW_LV=[ { name:'CALM',  col:'#9affc0', at:0,  cd:6.5, max:1 },     // cd = each gun's reload · max = rounds being telegraphed at once (barrage exempt)
              { name:'SORE',  col:'#ffd23f', at:25, cd:5.2, max:1 },
              { name:'ANGRY', col:'#ff9d3a', at:50, cd:4.2, max:2 },
              { name:'RIOT',  col:'#ff5d6c', at:70, cd:3.8, max:2 } ];
var CLAW_LV_BARKS=['', 'HON! GET MY MALLET!', 'SOMEBODY GET THE TWELVE-GAUGE — ROCK SALT, HON!', 'THE WHOLE DOCK\'S UP! OLD BAY BARRAGE!'];
var CLAW_WEAPON={ salt:{ n:3, spread:0.13, speed:470, col:'#ffe2a0' }, mallet:{ n:1, speed:400, grav:300 }, flare:{ n:1, speed:290, col:'#ff6a4a' } };

var CLAW_DOOR=0.68;

                   { sp:'twn_flare',  aim:'twn_flare_fire', fire:'twn_flare_fire',   w:'flare',  tier:0, x:0.275, from:-0.04,     h:0.092 },   // the waterman in his oilskins, out on the pier — covers the quiet end (and the drop)
                   { sp:'twn_mallet', aim:'twn_mallet', fire:'twn_mallet_fire',      w:'mallet', tier:1, x:0.745, from:CLAW_DOOR, h:0.082 },
                   { sp:'twn_mallet', aim:'twn_mallet', fire:'twn_mallet_fire',      w:'mallet', tier:1, x:0.820, from:CLAW_DOOR, h:0.080 },
                   { sp:'twn_gunner', aim:'twn_gunner', fire:'twn_gunner',           w:'salt',   tier:2, x:0.880, from:CLAW_DOOR, h:0.084 },
                   { sp:'twn_mallet', aim:'twn_mallet', fire:'twn_mallet_fire',      w:'mallet', tier:2, x:0.505, from:CLAW_DOOR, h:0.080 },   // pushes up the dock toward the quiet end
                   { sp:'twn_salt',   aim:'twn_salt_aim', fire:'twn_salt_fire',     w:'salt',   tier:3, x:0.935, from:CLAW_DOOR, h:0.083 } ];   // RIOT: a second shotgun on the porch (the owner, twn_owner, comes out with THE BULL)
// each townie shows sp (walk / stand / duck), aim during the '!' telegraph, fire for the shot's follow-through
// THE SPREAD — cheap at the quiet (left) end, rich on the porch under the guns. [sprite, value, size-vs-cow, x]
var CLAW_FEAST=[ ['lemons',100,0.55,0.10], ['old_bay',150,0.55,0.15], ['mallet',100,0.7,0.20], ['corn',150,0.7,0.33],
                 ['lager',150,0.75,0.38], ['crab',200,0.85,0.44], ['crab_b',200,0.8,0.49], ['bushel',250,0.95,0.56],
                 ['crab',200,0.85,0.63], ['tin_cooler',300,0.85,0.71], ['crab_b',200,0.8,0.78], ['bushel',250,0.95,0.86] ];
var CLAW_RESTOCK=[ ['crab',300,0.85], ['crab_b',300,0.8], ['bushel',400,0.95], ['tin_cooler',450,0.85], ['crab',300,0.85] ];   // FRESH off the steamer = worth 1.5x — the porch pays
// THE DOCK (scenery, fixed composition — the bay horizon strip + dock ground are drawn by drawBG/drawGround)
var CLAW_SCENE=[ { s:'fishing_pier', x:0.255, d:0.62 }, { s:'crab_pots', x:0.43, d:0.72, sc:0.62 },
                 { s:'crab_house', x:CLAW_DOOR, d:1.0 }, { s:'crab_pots', x:0.925, d:0.96, sc:0.55 } ];
var CLAW_DROP={ x:0.065, dy:0.075, r:0.055 };    // the bank ring: x (of W), dy below band().top (of H), r = radius (of W)
var claw=null, clawScore0=0, clawHp0=100, clawFailT=0, clawTally=null;
function clawOn(){ return mode==='bonus' && bonusKind==='crab' && !!claw; }
function clawEl(){ return CLAW_LEN-stageClock; }
function clawDrop(){ return { x:W*CLAW_DROP.x, y:band().top+H*CLAW_DROP.dy, r:W*CLAW_DROP.r }; }
function clawInDrop(s){ var d=clawDrop(); return !!s && Math.hypot(s.x-d.x, s.y-d.y)<d.r; }
function clawMuzzle(c){ var h=H*c.drawH*zdS(c); return { x:c.x+(c.flipX?-1:1)*h*0.30, y:groundY()+6+zdY(c)-h*0.70 }; }
function startClaw(fresh){
  mode='bonus'; bonusKind='crab'; clock=0; if(fresh===true){ hp=maxHP; }
  P=newPlayer(); R=newRival(); targets=[]; jets=[]; shots=[]; fx=[]; shake=0; truck=null; bandScroll=0; bandScroll2=0; roadScroll=0;
  meter=0; stageClock=CLAW_LEN; levelLen=CLAW_LEN; runActive=false; daveSpawned=true; moSpawned=true; superT=0;
  clawScore0=score; clawHp0=hp; clawFailT=0; clawTally=null;
  claw={ hold:0, holdN:0, banked:0, bankN:0, grabs:0, chain:0, lastGrab:-99, best:1, anger:0, lv:0, hits:0, spilled:0, lost:0,
         tel:[], pend:[], fx:[], restockT:0, volleyT:CLAW_VOLLEY_EVERY*0.6, dropT:0, bailT:0, outcome:null,
         bull:null, owner:null, bullHeld:false, bullBanked:false, bullBy:null, barrageSeen:false, flashLv:0,
         st:{ tel:0, shots:0, volleys:0, kinds:{}, minTel:99, atP:0, hitsP:0, hitsR:0, returns:0, restocks:0, holdMax:0, banks:0, firstLv:[0,null,null,null] } };
  buildScenery([],0,0,[]);                                          // rolls the bay moon + resets the scenery pools
  scenery=CLAW_SCENE.map(function(p){ return { x:W*p.x, s:p.s, sc:p.sc||1, d:p.d, fl:false }; }); scenery.sort(function(a,b){return a.d-b.d;});
  for(var i=0;i<CLAW_FEAST.length;i++){ var f=CLAW_FEAST[i], lt=lootTarget(f[0],f[1],f[2], W*f[3], false); lt.zd=0.16; targets.push(lt); }
  for(var j=0;j<CLAW_TOWNIES.length;j++){ var T=CLAW_TOWNIES[j], tw=clawTownie(T); if(T.tier===0){ tw.x=W*T.x; tw.st='post'; tw.gone=false; } targets.push(tw); }
  state='play'; flash('CLAW & ORDER — STEAL THE FEAST, BANK IT AT THE DROP','#ffd23f',2.4);
  sayLater(pick(CRAB_FEAST_BARKS),'#ffd23f',2.6);
}
function clawTownie(T){
  return { kind:'townie', protect:true, def:{val:0,meter:0,lock:1,wander:0}, sprite:T.sp, spS:T.sp, spA:T.aim||T.sp, spF:T.fire||T.sp, w:T.w, tier:T.tier, post:W*T.x, from:W*T.from,
    x:W*T.from, y:groundY(), vx:0,vy:0, dir:1, flipX:false, lock:0, lifting:false, gone:true, respawn:1e9, zd:0.05, drawH:T.h, noPips:true,
    st:'in', fireCd:rnd(1.2,2.6), duckT:0, hitT:0 }; }
function clawLevel(a){ return a>=CLAW_LV[3].at?3 : a>=CLAW_LV[2].at?2 : a>=CLAW_LV[1].at?1 : 0; }
function clawThief(s){
  if(!s) return false;
  var beaming = s.lock && !s.lock.gone && s.lock.kind==='loot';
  return s===P ? (claw.hold>0 || !!beaming) : ((s.thiefU||0)>clawEl() || !!beaming); }
function clawPickTarget(){
  var riot=claw.lv>=3, p=P && (riot || clawThief(P)), r=R && R.stun<=0 && (riot || clawThief(R));
  if(p && r) return Math.random()<0.65?P:R; return p?P : r?R : null; }
function clawTelegraph(c,tgt,volley,spread){
  var m=clawMuzzle(c), ay=tgt.y+(spread?rnd(-H*0.02,H*0.02):0), ax=tgt.x+(spread||0);
  claw.tel.push({ who:c, tgt:tgt, ax:ax, ay:ay, t:0, T:volley?CLAW_VOLLEY_TEL:CLAW_TEL, volley:!!volley, mx:m.x, my:m.y });
  claw.st.tel++; if(tgt===P) claw.st.atP++; c.aimT=volley?CLAW_VOLLEY_TEL:CLAW_TEL; }
function clawFire(e){
  var c=e.who; if(!c || c.st!=='post' || c.duckT>0) return;
  var m=clawMuzzle(c), Wp=CLAW_WEAPON[c.w], dx=e.ax-m.x, dy=e.ay-m.y, L=Math.hypot(dx,dy)||1;
  claw.st.minTel=Math.min(claw.st.minTel, e.t); claw.st.kinds[c.w]=(claw.st.kinds[c.w]||0)+1;
  if(c.w==='mallet'){ var T=clamp(L/Wp.speed,0.55,1.35), vx=dx/T, vy=dy/T-0.5*Wp.grav*T;
    shoot(m.x,m.y,vx,vy,'mallet','#c8a27a'); var s=shots[shots.length-1]; s.grav=Wp.grav; s.claw=true; s.life=2.6; s.tgt=e.tgt; s.ax=e.ax; s.ay=e.ay; claw.st.shots++; sfxT('deflect',0.2,0.25); }
  else for(var k=0;k<Wp.n;k++){ var a=Math.atan2(dy,dx)+(Wp.n>1?(k-(Wp.n-1)/2)*Wp.spread:0)+rnd(-0.02,0.02), v=Wp.speed*rnd(0.95,1.05);
    shoot(m.x,m.y,Math.cos(a)*v,Math.sin(a)*v, c.w, Wp.col); var s2=shots[shots.length-1]; s2.claw=true; s2.life=3.2; s2.tgt=e.tgt; s2.ax=e.ax; s2.ay=e.ay; claw.st.shots++; }
  if(c.w==='salt') sfxT('rocket',0.12,0.30); else if(c.w==='flare') sfxT('rocket',0.2,0.22);
  addFx(m.x,m.y,'spark',c.w==='flare'?'#ff6a4a':'#ffe7a0',0.22); c.poseT=0.3;
}
// the hat comes off: a WARBLE ricochet that drops onto a townie (called from the shots loop)
function clawRicochet(sh){
  for(var i=0;i<targets.length;i++){ var c=targets[i]; if(c.kind!=='townie' || c.st!=='post' || c.duckT>0) continue;
    var hh=H*c.drawH*zdS(c), cy=groundY()+6-hh*0.55;
    if(Math.abs(sh.x-c.x)<hh*0.45 && Math.abs(sh.y-cy)<hh*0.6){
      c.duckT=CLAW_DUCK; c.hitT=0.3; claw.st.returns++; score+=CLAW_RETURN;
      fx.push({x:c.x,y:cy-hh*0.3,kind:'pts',col:'#bfefff',t:0,life:0.95,val:CLAW_RETURN,big:false});
      claw.fx.push({kind:'hat',x:c.x,y:cy-hh*0.45,vx:rnd(-60,60),vy:-220,t:0,life:1.2});
      flash('RETURN TO SENDER  +'+CLAW_RETURN,'#bfefff',0.9); sfxT('deflect',0.2,0.6); return true; } }
  return false; }
function clawGrab(tg){
  var el=clawEl(); claw.chain = (el-claw.lastGrab<=CLAW_CHAIN) ? claw.chain+1 : 1; claw.lastGrab=el;
  var mult=Math.min(CLAW_MULT_MAX, claw.chain), pts=tg.def.val*mult; claw.best=Math.max(claw.best,mult);
  claw.hold+=pts; claw.holdN++; claw.grabs++; claw.st.holdMax=Math.max(claw.st.holdMax,claw.hold);
  claw.anger=clamp(claw.anger+Math.min(300,tg.def.val)*CLAW_ANGER.grab, 0, 100);   // a fresh platter pays more but riles no more than a cooler
  if(tg===claw.bull){ claw.bullHeld=true; claw.bullBy='you'; claw.anger=CLAW_ANGER.bull; flash('THE BULL!  +'+pts+' — NOW GET IT HOME','#ffd23f',1.6); sayLater('THE OWNER: THAT WAS MY NUMBER-ONE JIMMY!','#ff9d3a',0.8); }
  else flash('+'+pts+(mult>1?'  ×'+mult+' STREAK':'')+'  — IN THE HOLD', mult>1?'#ffd23f':'#9affc0', 0.7);
  if(fx.length>=MAX_FX) fx.shift(); fx.push({x:P.x,y:P.y+SAUCER_W()*0.1,kind:'pts',col:mult>1?'#ffd23f':'#9affc0',t:0,life:0.95,val:pts,big:pts>=1000}); }
function clawRivalGrab(tg){
  claw.anger=clamp(claw.anger+Math.min(300,tg.def.val)*CLAW_ANGER.grab*CLAW_ANGER.rival, 0, 100); if(R) R.thiefU=clawEl()+3.0;
  if(tg===claw.bull){ claw.bullBy='rival'; claw.anger=clamp(claw.anger+CLAW_ANGER.rivalBull,0,100); flash('THE RIVAL TOOK THE BULL!','#7fb0ff',1.4); } }
function clawBank(){
  var n=claw.hold; if(n<=0) return; score+=n; claw.banked+=n; claw.bankN++; claw.st.banks++; claw.hold=0; claw.holdN=0; claw.chain=0;
  if(claw.bullHeld){ claw.bullHeld=false; claw.bullBanked=true; }
  var d=clawDrop(); addFx(d.x,d.y,'snatch','#39ff14',0.6); fx.push({x:d.x,y:d.y,kind:'pts',col:'#39ff14',t:0,life:1.1,val:n,big:n>=1000});
  flash('BANKED  +'+n+'  — STREAK RESET','#39ff14',1.2); sfx('pickup',0.5); }
// a townie round lands on the player (routed here from hitPlayer, AFTER the warble / invuln checks)
function clawHit(){
  claw.hits++; claw.st.hitsP++; hp-=34; P.stun=0.9; P.invuln=1.8; shake=16; planting=false;
  var sp=Math.round(claw.hold*CLAW_SPILL); claw.hold-=sp; claw.spilled+=sp; claw.chain=0;
  addFx(P.x,P.y,'boom','#ff7a3a',0.6); sfx('hit',0.5);
  if(sp>0){ for(var k=0;k<Math.min(3,1+(sp/400|0));k++) claw.fx.push({kind:'spill',sp:pick(['crab','crab_b','lager','old_bay']),x:P.x+rnd(-12,12),y:P.y+SAUCER_W()*0.15,vx:rnd(-90,90),vy:rnd(-140,-60),rot:0,vr:rnd(-7,7),t:0,life:1.6});
    flash('HIT — SPILLED '+sp+' INTO THE BAY','#ff9d3a',1.1); }
  else flash('HIT — HULL '+Math.max(0,Math.round(hp)),'#ff9d3a',0.9);
  if(hp<=0) clawSink(); }
function clawSink(){
  claw.outcome='sunk'; claw.lost=claw.hold; claw.hold=0; claw.chain=0; if(claw.bullHeld){ claw.bullHeld=false; claw.bullBy='lost'; }
  hp=CLAW_PATCH; state='clawfail'; clawFailT=0; idleT=0; planting=false; held={}; msg=''; msgT=0; sfx('denied',0.6); shake=14;
  clawTally=clawMakeTally(); }
function clawMakeTally(){ var perfect=(claw.outcome!=='sunk' && claw.bullBanked && claw.hits===0);
  return { outcome:claw.outcome, banked:claw.banked, bankN:claw.bankN, grabs:claw.grabs, best:claw.best, hits:claw.hits, spilled:claw.spilled, lost:claw.lost,
    bull:claw.bullBanked?'banked':claw.bullBy==='rival'?'rival':claw.bullBy==='lost'?'lost':claw.bull?'escaped':'never', perfect:perfect,
    bonus:perfect?BONUS_PERFECT:0, returns:claw.st.returns, at:+clawEl().toFixed(1), lv:claw.lv }; }
function clawEnd(kind){ if(state!=='play') return;
  if(kind==='time' && claw.hold>0){ flash('LAST CALL — HOLD BANKED','#39ff14',1.2); clawBank(); }
  claw.outcome=kind; clawTally=clawMakeTally(); if(clawTally.perfect) score+=BONUS_PERFECT;
  resKind='claw'; resBonus=claw.banked+clawTally.bonus; resPerfect=clawTally.perfect; msg=''; msgT=0; planting=false; advanceSegment(); }
function clawRetry(){ score=clawScore0; hp=clawHp0; held={}; planting=false; sfx('launch',0.6); startClaw(false); }   // vault practice only
function clawLimpOn(){ held={}; planting=false;                     // the arcade run: no retry — keep what you banked, take the patched hull into the next zone
  if(soloStage){ backToFront(); return; }
  resKind='claw'; resBonus=claw?claw.banked:0; resPerfect=false; sfx('transition',0.55); resLast=(segIdx+1>=SCHEDULE.length); proceedSegment(); }
// ---- the step ----
function clawStep(dt){
  var el=clawEl(), c, i;
  if(el-claw.lastGrab>CLAW_CHAIN && claw.chain>0){ if(claw.chain>1) flash('STREAK OVER','#9c89c4',0.6); claw.chain=0; }
  // THE DOCK: greed in, slow cool-off, a floor that creeps up with the clock
  var floor=CLAW_ANGER.floor*clamp(el/CLAW_LEN,0,1);
  claw.anger=clamp(Math.max(floor, claw.anger-CLAW_ANGER.decay*dt), 0, 100);
  var lv=clawLevel(claw.anger); if(claw.bull && !claw.bull.gone) lv=Math.max(lv,2);   // the owner guarding the Bull keeps the porch hot
  if(lv>claw.lv){ if(claw.st.firstLv[lv]==null) claw.st.firstLv[lv]=+el.toFixed(1);
    if(lv>claw.flashLv){ claw.flashLv=lv; flash('THE DOCK IS '+CLAW_LV[lv].name+' — '+CLAW_LV_BARKS[lv], CLAW_LV[lv].col, 1.8); shake=Math.max(shake,4+lv*2); } }
  claw.lv=lv;
  // the crowd: walk out of the door / off the pier when your greed calls them, take a post, telegraph, fire
  var live=0; for(i=0;i<claw.tel.length;i++) if(!claw.tel[i].volley) live++;
  for(i=0;i<targets.length;i++){ c=targets[i]; if(c.kind!=='townie') continue;
    if(c.hitT>0) c.hitT-=dt; if(c.poseT>0) c.poseT-=dt; if(c.aimT>0) c.aimT-=dt;
    c.sprite = c.duckT>0 ? c.spS : c.poseT>0 ? c.spF : c.aimT>0 ? c.spA : c.spS;
    if(c.st==='in'){ if(c.tier<=lv || c===claw.owner){ c.st='walk'; c.x=c.from; c.gone=false; } else continue; }
    if(c.st==='walk'){ var dx=c.post-c.x, sp=W*0.075*dt; if(Math.abs(dx)<=sp){ c.x=c.post; c.st='post'; c.fireCd=rnd(0.6,1.4); } else c.x+=dx>0?sp:-sp; c.flipX=dx<0; continue; }
    var tg=(P && clawThief(P))?P:(R && clawThief(R))?R:P; if(tg) c.flipX = tg.x<c.x;
    if(c.duckT>0){ c.duckT-=dt; continue; }
    var active = c.tier<=lv || c===claw.owner;
    if(!active) continue;
    c.fireCd-=dt;
    if(c.fireCd<=0){ var aimed=false;
      for(var q=0;q<claw.tel.length;q++) if(claw.tel[q].who===c) aimed=true;
      if(!aimed && live<CLAW_LV[lv].max){ var t2=clawPickTarget(); if(t2){ clawTelegraph(c,t2,false,0); live++; } }
      c.fireCd=CLAW_LV[lv].cd*rnd(0.8,1.25); } }
  // OLD BAY BARRAGE (RIOT): every posted gun telegraphs together, fanned around you — read the gaps or WARBLE
  if(lv>=3){ claw.volleyT-=dt; if(claw.volleyT<=0){ claw.volleyT=CLAW_VOLLEY_EVERY*rnd(0.9,1.15); var n=0;
      for(i=0;i<targets.length;i++){ c=targets[i]; if(c.kind!=='townie'||c.st!=='post'||c.duckT>0) continue; var tv=clawPickTarget()||P;
        clawTelegraph(c,tv,true,(n%2?1:-1)*W*0.09*Math.ceil(n/2)); n++; }   // fanned 0.09W apart: real gaps wider than the saucer's hit radius
      if(n){ claw.st.volleys++; if(!claw.barrageSeen){ claw.barrageSeen=true; flash('OLD BAY BARRAGE! — THREAD IT OR WARBLE','#ff5d6c',1.6); } } } }

  if(tg.def.val>0 && !(_claw && !isR)){ if(fx.length>=MAX_FX)fx.shift(); fx.push({x:sh.x,y:sh.y+SAUCER_W()*0.1,kind:'pts',col:isR?'#7fb0ff':'#ffe23a',t:0,life:0.95,val:tg.def.val,big:tg.def.val>=1000}); }   // floating +POINTS so each grab's value READS (cow 100 / person 300 / farmer 250 / Dave 2000 / Mo 3000)
  meter=clamp(meter+tg.def.meter,0,100); addFx(sh.x,sh.y,'snatch', isR?'#7fb0ff':'#7fe9ff',0.5);
  sfx(tg.def.meter<0?'brisket':(tg.kind==='cow'||tg.isMo)?'cow':'pickup', isR?0.4:0.7);
  if(tg.isMo){ flash(isR?'RIVAL SNATCHED MO!':MO_CAUGHT_BARK, isR?'#7fb0ff':'#ffd23f',1.6); sayLater(pick(DAVE_MO_BARKS),'#ffd23f',1.5); }   // Dave's one Dairy Flats beat: he reacts to Mo
  else if(tg.def.val>=2000){ var who=bossName(tg.sprite);                                  // wild Dave (2000) AND the champion-lap Dr. L come through here — name the right one
    flash(isR?'RIVAL GOT '+who:who+'! +'+tg.def.val, isR?'#7fb0ff':'#ffd23f',1.4);
    if(!isR) sayLater(pick(tg.sprite==='drl_g'?DRL_CAUGHT_BARKS:DAVE_CAUGHT_BARKS),'#ffd23f',0.9); }
  else if(!isR && tg.def.meter<0){                                  // BRISKET: cools the meter AND charges the SUPER BEAM
    if(++briskN>=SUPER_EVERY){ briskN=0; superT=SUPER_SECS; flash('★ SUPER BEAM ★','#ffd23f',1.5); sfx('brisket',0.55); }
    else flash(level>=1?pick(DAVE_OUTRAGE_BARKS):'BRISKET — COOLED', level>=1?'#ffd23f':'#9affc0',1.0);
  }
  if(tg.def.selfstun){ sh.stun=Math.max(sh.stun,0.5); if(!isR) flash((tg.kind==='soldier'?'SOLDIER':'FARMER')+' GOT YOU','#ff9d3a',0.8); }
  if(tg.kind==='loot' && !isR && !_claw){ flash((tg.isBoss?bossName(tg.sprite)+'!  +':'+')+tg.def.val, tg.isBoss?'#ffd23f':'#9affc0', tg.isBoss?1.2:0.6); }
  if(tg.kind==='gnome' && mode==='gunpowder' && gpStats && !isR){ gpStats.beamed++; gpStats.beamPts+=tg.def.val; }   // the beam's tally (soldier kills pay nothing)
  if(tg.isMo || tg.kind==='loot' || tg.kind==='gnome'){ tg.gone=true; tg.respawn=1e9; }   // Mo + bonus loot + gnomes are one-and-done (no cow respawn)
  else { tg.gone=true; tg.respawn=rnd(1.6,3.2); }
  tg.lock=0; tg.lifting=false; tg.owner=0;
}

/* ---------- update ---------- */
function stageOf(){ return meter<35?0 : meter<65?1 : meter<90?2 : 3; }   // original curve: YELLOW 35 / ORANGE 65 / RED ~90
// HEIGHTENED RESPONSE — only urban/beltway/military maps get the RED onslaught (jet swarm + sourced ground AA).
// Rural maps (Dairy Flats / Corn Country) build the meter for TENSION but never unleash the lethal climax.
function onslaughtMap(){ var L=LEVELS[level]; return mode==='base' || (mode==='campaign' && !!(L&&(L.red||L.aa))); }
// ORDNANCE targets EITHER invader (not just the player) — the collision path already damages both ships.
function fireTarget(){ return (R && chance(0.5)) ? R : P; }
var STAGECOL=['#39ff14','#ffe23a','#ff9d3a','#ff5d6c'], STAGENAME=['GREEN','YELLOW','ORANGE','RED'];

function update(dt){
  t+=dt;
  if(state==='attract'){ if(msgT>0)msgT-=dt;
    if(attractMode==='reel'){ attractClk+=dt; if(attractClk>REEL_SEG) startDemoCut(); }   // reel pods, then cut to a live demo
    else { demoClk+=dt; updateAttract(dt); if(demoClk>DEMO_SEG) endDemoCut(); }            // live NEW-game demo cut
    return; }
  if(state==='ending'){ endT+=dt; if(msgT>0)msgT-=dt; if(endT>=9.5){ endGame(); } return; }   // credit page -> leaderboard
  if(state==='lockin'){ lockinT+=dt; if(msgT>0)msgT-=dt; if(lockinT>7){ twoP=false; startRun(); } return; }   // no answer in 7s -> solo
  if(state==='initials'){ idleT+=dt; if(msgT>0)msgT-=dt; if(idleT>30) confirmInitials(); return; }   // afk -> auto-lock the initials
  if(state==='board'){ boardT+=dt; if(msgT>0)msgT-=dt; if(boardT>10) enterFront(); return; }
  if(state==='result'){ resT+=dt; if(msgT>0)msgT-=dt; if(shake>0)shake*=0.9; if(resT>=RESULT_HOLD) proceedSegment(); return; }   // tally auto-advances (BEAM skips it)
  if(state==='gpfail'){ gpFailT+=dt; idleT+=dt; if(msgT>0)msgT-=dt; if(shake>0)shake*=0.9; for(var _f=gpFx.length-1;_f>=0;_f--){ gpFx[_f].t+=dt; if(gpFx[_f].t>gpFx[_f].life) gpFx.splice(_f,1); } return; }   // GUNPOWDER FAILED card: frozen field, retry prompt
  if(state==='clawfail'){ clawFailT+=dt; idleT+=dt; if(msgT>0)msgT-=dt; if(shake>0)shake*=0.9; return; }   // CLAW & ORDER: RUN OFF THE DOCK card
  if(state!=='play'){ if(state==='select'||state==='over'||state==='clear')idleT+=dt; if(msgT>0)msgT-=dt; if(shake>0)shake*=0.9; return; }
  idleT=0;   // playing — reset the attract idle timer (so it counts from the game-over screen)
  while(score>=nextExtra && lives<99){ lives++; nextExtra+=EXTRA_LIFE; flash('★ EXTRA SHIP ★','#39ff14',1.5); sfx('pickup',0.55); }   // arcade extra-life reward
  clock+=dt; stageClock-=dt; if(msgT>0)msgT-=dt; if(shake>0)shake-=dt*40;
  if(pendBarkAt>0 && clock>=pendBarkAt){ pendBarkAt=0; flash(pendBark,pendBarkCol,1.8); }   // deferred barks (Dave answers, round-start hollers)
  if(P.stun>0)P.stun-=dt; if(P.invuln>0)P.invuln-=dt; if(superT>0)superT-=dt;
  var stg=stageOf(), L=LEVELS[level], elapsed=levelLen-stageClock;
  var aaHot = mode==='base' || (mode==='campaign' && L && L.aa);   // AA + jets hot from t=0 (THE BELTWAY / OUTSKIRTS)
  var ons = onslaughtMap();                                        // this map gets the heightened (RED) military response?

  pumpPlayer(dt); spring(P,P.tx,P.ty,dt); emitBubbles(P,'#39ff14',dt);   // green player propulsion
  P.bank += (clamp(P.vx/190,-1,1)-P.bank)*Math.min(1,7*dt);

  // meter climb (campaign only — base stays pinned RED, bonus has no military response)
  // RURAL maps build the meter for tension but CAP below RED (never the onslaught); urban/beltway/military fill to RED.
  if(mode==='campaign'){ var mFill = L.aa?1.05 : L.red?1.35 : 0.5; meter = clamp(meter + dt*mFill, 0, ons?100:64); }   // red maps fill fast enough to reach the RED climax within their clock

  // THE RUN — once past the zone's scroll_start the world drags you back; beaming anchors you
  var worldSpeed = 0;   // HOLD the area — work one spot for the calm part of the clock; it only moves on THE RUN
  if(mode==='campaign' && elapsed>=L.scrollStart){
    if(!runActive){ runActive=true; flash('>>> THE RUN <<<','#ff9d3a',1.4); sfx('run',0.5); }
    var ramp=clamp((elapsed-L.scrollStart)/Math.max(1,levelLen-L.scrollStart),0,1);
    worldSpeed = 10 + 52*ramp;                                                     // gentler push (was 16 + 90)
    if(!planting && P.stun<=0) P.tx=clamp(P.tx-(14+40*ramp)*dt, W*0.05, W*0.95);   // softer drag toward the back edge
  }
  // scenery scrolls left (the world comes at you), wrapping
  scrollScenery(worldSpeed*dt);
  // STOP-AND-GO, and the two lanes are out of phase so the road is never uniform. Both keep a floor of
  // 0.3 so neither ever freezes (a frozen band was a real bug once) -- they crawl, then surge.
  var flowA=0.30+0.70*ease01(Math.sin(clock*0.23)*0.5+0.5);
  var flowB=0.30+0.70*ease01(Math.sin(clock*0.19+2.4)*0.5+0.5);
  bandScroll  += (worldSpeed + 58)*flowA*dt;                    // FAR lane: with the world push during THE RUN
  bandScroll2 += 52*flowB*dt;                                   // NEAR lane: oncoming, its own pace
  roadScroll += worldSpeed*dt;                                 // the asphalt only moves as fast as the world does — so the cars now drive ALONG it

  // MO (Dairy Flats only)
  if(mode==='campaign' && L.mo){
    if(!moTele && elapsed>=MO_TELE){ moTele=true; flash("DR. L: the herd's gone quiet — the FIRST one is coming back…",'#bdf2cf',2.0); }
    if(!moSpawned && elapsed>=MO_APPEAR){ moSpawned=true; spawnMo(); }
    if(moTarget && !moTarget.gone && clock>=moEscapeAt){ moTarget.gone=true; moTarget.respawn=1e9; flash(MO_ESCAPED,'#bdf2cf',2.2); moTarget=null; }   // Mo escapes ungrabbed
  }

  // clock -> stage clear / advance the schedule
  if(mode==='gunpowder'){ gunpowderStep(dt); if(state==='play' && stageClock<=0) gpWin(); }   // FAIL is decided inside the step (people < GP_MUST_SAVE)
  else if(mode==='base'){ if(stageClock<=0){ score+=3000; if(twoP) rivalScore+=3000; flash('BASE CLEARED  +3000','#9affc0',1.6); resKind='base'; resBonus=3000; resPerfect=false; advanceSegment(); } }   // 2P: both humans cleared -> both banked
  else if(clawOn()){ clawStep(dt); }   // CLAW & ORDER: bank / bail / sink / last call are all decided inside the step
  else if(mode==='bonus'){
    var lootLeft=0; for(var i=0;i<targets.length;i++) if(!targets[i].gone) lootLeft++;
    if(lootLeft===0){ score+=BONUS_PERFECT; if(twoP) rivalScore+=BONUS_PERFECT; flash('PERFECT!  +'+BONUS_PERFECT,'#ffd23f',1.8); resKind='bonus'; resBonus=BONUS_PERFECT; resPerfect=true; advanceSegment(); }   // all loot swept -> the advertised reward
    else if(stageClock<=0){ flash('TIME — SWEEP OVER','#9affc0',1.4); resKind='bonus'; resBonus=0; resPerfect=false; advanceSegment(); }
  }
  else { if(!daveSpawned && stageClock<28) spawnDave();
         if(stageClock<=0){ score+=2000; if(twoP) rivalScore+=2000;
           flash(L.zone+' CLEARED  '+(R?(score>rivalScore?'— ROUND TO YOU':score<rivalScore?'— ROUND TO RIVAL':'— DEAD HEAT'):'+2000'),'#9affc0',1.6);
           resKind='round'; resBonus=2000; resPerfect=false; advanceSegment(); } }

  if(twoP) pumpRival(dt); else updateRival(dt);                     // 2P: P2 flies the rival · 1P: CPU. beam block reads R.beamOn either way

  /* PLAYER vs RIVAL: WARBLE phases you THROUGH the other UFO (whip to its far side);
     no warble = a NO-DAMAGE BONK (rebound apart, no stun). And a live tractor beam is a
     BARRIER — you can't fly through the rival's beam (or it through yours) unless warbling. */
  if(R && mode!=='base' && P.stun<=0 && R.stun<=0){
    var near=SAUCER_W()*0.60;
    if(Math.abs(P.x-R.x)<near && Math.abs(P.y-R.y)<SAUCER_W()*0.45){
      if(warbling()){                                  // WARBLE -> whip out the rival's FAR side (phase through)
        var sd2=(P.x<=R.x)?1:-1; P.x=clamp(R.x+sd2*near,W*0.05,W*0.95); P.tx=P.x;
        R.x=clamp(R.x-sd2*near*0.5,W*0.05,W*0.95); addFx(P.x,P.y,'snatch','#9affc0',0.3);
      } else if(!warblingS(R)){                         // no warble -> rebound apart, NO stun (no-damage bonk)
        var mid=(P.x+R.x)/2, s3=(P.x<=R.x)?1:-1;
        P.x=clamp(mid-s3*near,W*0.05,W*0.95); P.tx=P.x; R.x=clamp(mid+s3*near,W*0.05,W*0.95);
        planting=false; addFx(mid,(P.y+R.y)/2,'spark','#ffd27a',0.25); sfxT('hit',0.4,0.3);
      }
    }
    var bw=SAUCER_W()*0.42;                             // beam-column half-width
    // the beam hangs BELOW the emitter (belly->ground), NOT above it — so you can fly OVER a beaming
    // rival. Only block when the passer is at/below the emitter's belly (in the shaft), never above it.
    var vg=SAUCER_W()*0.15;                             // small grace so a clean pass-over reads
    // COMMITTED-CATCH IMMUNITY. The barrier exists to stop you flying THROUGH a live beam. It was also
    // evicting a saucer that had already parked and started lifting: whoever got HIGHER could shove the
    // other off its own catch (the shove moves .x AND .tx, which breaks the lock), grab the drop, and be
    // shoved off in turn -- the endless up/down/up/down. A saucer already lifting something is committed
    // and cannot be pushed off it; a saucer merely flying through still is. Both locks are last frame's
    // (they are cleared just below), which is what we want: it takes real committed progress to be immune.
    var pHold = !!(P.lock && P.lock.lock>0 && !P.lock.gone);
    var rHold = !!(R.lock && R.lock.lock>0 && !R.lock.gone);
    if(R.beamOn && !warbling() && !pHold && Math.abs(P.x-R.x)<bw && P.y>R.y-vg){ P.x=(P.x<=R.x)?clamp(R.x-bw,W*0.05,W*0.95):clamp(R.x+bw,W*0.05,W*0.95); P.tx=P.x; }
    if(planting && !warblingS(R) && !rHold && Math.abs(R.x-P.x)<bw && R.y>P.y-vg){ R.x=(R.x<=P.x)?clamp(P.x-bw,W*0.05,W*0.95):clamp(P.x+bw,W*0.05,W*0.95); }
  }

  /* beam / abduction (no beaming in base) — player (1) vs the blue rival (2): crossed beams cancel, a steal halves the lock */
  P.lock=null; if(R) R.lock=null;
  var pT=-1, rT=-1;
  if(planting && P.stun<=0 && mode!=='base'){
    var bestD=(superT>0?W*0.11:W*0.06); for(var i=0;i<targets.length;i++){ var c=targets[i]; if(c.gone||c.hidden||c.protect) continue; var dxp=Math.abs(c.x-P.x);   // SUPER BEAM = wider acquisition; hidden critters + protected defenders aren't lockable
      if(dxp<bestD && P.y<c.y){ bestD=dxp; pT=i; } }
  }
  if(R && R.beamOn && R.stun<=0){
    var bestDr=W*0.06; for(var i=0;i<targets.length;i++){ var c=targets[i]; if(c.gone||c.hidden||c.protect||c.guarded) continue; var dxr=Math.abs(c.x-R.x);
      if(dxr<bestDr && R.y<c.y){ bestDr=dxr; rT=i; } }
  }
  if(pT>=0 && pT===rT){                                              // CROSSED BEAMS — the ESTABLISHED claim holds
    // Was: nobody gains and the lock bleeds out. That is what let the rival BOX YOU OUT -- it only had to
    // park on your catch to deny it outright, back off 1.4s, and come straight back. You could be denied
    // every grab without the rival ever having to be faster than you.
    // Now a contest DRAGS instead of denying: whoever established the claim keeps pulling, at CONTEST_DRAG
    // speed, and the late contester gains nothing. Getting there first is what wins the target -- being
    // second only slows it down. Ties (neither committed yet) still stalemate, so a genuine dead heat reads.
    var tg=targets[pT]; tg.lifting=true; addFx((P.x+R.x)/2,(P.y+R.y)/2,'spark','#ffe23a',0.25);
    if(R) R.contestCd=clock+CONTEST_BACKOFF;                         // and it backs off this catch longer than before
    if(tg.owner===1){ tg.lock=clamp(tg.lock+dt/tg.def.lock*CONTEST_DRAG*(superT>0?2:1),0,1); P.lock=tg; if(tg.lock>=1) abduct(tg,1); }
    else if(tg.owner===2){ tg.lock=clamp(tg.lock+dt/(tg.def.lock*blueLockMul())*CONTEST_DRAG,0,1); R.lock=tg; if(tg.lock>=1) abduct(tg,2); }
    else tg.owner=0;                                                 // nobody had it yet — a true dead heat, neither gains
  } else {
    if(pT>=0){ var tg=targets[pT]; if(tg.owner===2 && tg.lock>0) tg.lock*=0.5; tg.owner=1; P.lock=tg;     // steal from the rival halves its progress
      tg.lock=clamp(tg.lock+dt/tg.def.lock*(superT>0?2:1),0,1); tg.lifting=true; if(tg.lock>=1) abduct(tg,1); }   // SUPER BEAM locks 2x faster
    if(rT>=0){ var tg=targets[rT]; if(tg.owner===1 && tg.lock>0) tg.lock*=0.5; tg.owner=2; R.lock=tg;
      tg.lock=clamp(tg.lock+dt/(tg.def.lock*blueLockMul()),0,1); tg.lifting=true; if(tg.lock>=1) abduct(tg,2); }   // CPU: 1.4x slower (1.1x on DEFCON) so it is beatable. HUMAN P2: parity with P1.
  }
  for(var i=0;i<targets.length;i++){ var c=targets[i]; if(c!==P.lock && (!R||c!==R.lock) && c.lock>0){ c.lock=Math.max(0,c.lock-dt*1.5); if(c.lock<=0){ c.lifting=false; c.owner=0; } } }

  /* targets move + shoot */
  for(var i=0;i<targets.length;i++){ var c=targets[i];
    if(c.gone){ if(c.respawn>1e8) continue; c.respawn-=dt; if(c.respawn<=0){ c.gone=false; c.lock=0; c.lifting=false; c.x=W*rnd(0.08,0.92); c.y=groundY();
      var nk=pickSpawnKind(); c.kind=nk; c.def=TARGETKINDS[nk]; c.sprite=c.def.sprites[(Math.random()*c.def.sprites.length)|0]; c.isMo=false;
      c.hidden=false; c.hideT=undefined;                                                       // clear stale cover state, then re-roll hide only for civilians on military levels
      if(mode==='campaign' && LEVELS[level] && LEVELS[level].aa && (nk==='cow'||nk==='person') && Math.random()<0.28){ c.hidden=true; c.hideT=rnd(1.5,3); } } continue; }
    if(c.hideT!==undefined && !c.lifting){ c.hideT-=dt; if(c.hideT<=0){ c.hidden=!c.hidden; c.hideT=c.hidden?rnd(2,3.2):rnd(3,4.5); } }   // hide & emerge cycle (military levels)
    if(c.hidden){ c.y=groundY(); continue; }                                            // tucked in cover -> drawn as a bush, not lockable, doesn't shoot
    if(c.lifting && c.lock>0){ var sh=(c.owner===2&&R)?R:P; c.x += (sh.x-c.x)*Math.min(1,dt*6);          // slide into the OWNER's beam column (player or rival)
      c.y = groundY() - (groundY()-(sh.y+SAUCER_W()*0.18))*c.lock; }
    else { c.y=groundY(); c.x += c.dir*c.def.wander*dt; if(c.x<W*0.05||c.x>W*0.95)c.dir*=-1; }
    if(c.def.shoots && !c.lifting && stg>=1){ c.fireCd-=dt; if(c.fireCd<=0){ c.fireCd=c.def.dave?rnd(0.7,1.3):rnd(2.2,3.8);
      var ft=fireTarget(), dx=ft.x-c.x, dy=ft.y-(c.y-20), L2=Math.hypot(dx,dy)||1, sp=c.def.dave?520:380;   // aim at EITHER invader
      shoot(c.x,c.y-30,dx/L2*sp,dy/L2*sp,'potshot',c.def.dave?'#ffd23f':'#ffe2a0'); addFx(c.x,c.y-30,'spark',c.def.dave?'#ffd23f':'#ffe2a0',0.2); } }
  }

  /* jets */
  var jetCap = stress?9 : mode==='base'?4 : (defcon?3:2);                       // DEFCON 1 = a 3-jet swarm (normal caps at 2)
  var jetGap = stress?0.35 : mode==='base'?0.9 : (stg>=3?(defcon?1.25:1.7):(defcon?1.9:2.4));   // DEFCON 1 = tighter jet cadence
  if(stg>=1 || aaHot){ jetTimer-=dt; if(jetTimer<=0 && jets.length<jetCap){ spawnJet(stg, !ons || (stg===1 && !aaHot)); jetTimer=jetGap+rnd(0,jetGap); } }   // rural / YELLOW = looms only (no strafing run)
  for(var j=jets.length-1;j>=0;j--){ var je=jets[j];
    if(je.disabled){ je.spinT+=dt; je.x+=je.vx*dt; je.vy-=70*dt; je.y+=je.vy*dt; je.scale=Math.max(0,je.scale-dt*0.55); je.bank+=dt*16;   // DISABLED: tumble back into the distance + shrink
      if(chance(0.55)) addFx(je.x+rnd(-6,6),je.y+rnd(-4,4),'smoke','#9aa6b0',0.55);   // sputtering smoke trail as it banks away
      if(je.spinT>1.7 || je.scale<=0.18 || je.y<band().top-H*0.25){ addFx(je.x,je.y,'spark','#ffb066',0.45); addFx(je.x,je.y,'snatch','#9affc0',0.4); jets.splice(j,1); } continue; }   // crashes back there -> puff, gone
    je.x+=je.vx*dt;
    if(je.horizon){ je.y=je.base+Math.sin(clock*je.spd+je.phase)*je.amp; if((je.dir>0&&je.x>W+90)||(je.dir<0&&je.x<-90)) jets.splice(j,1); continue; }   // loom: drift only, harmless
    var ty=je.base+Math.sin(clock*je.spd+je.phase)*je.amp;
    if(GLIDE){ var oy=je.y; je.vy+=((ty-je.y)*accel-je.vy*damp)*dt; je.y+=je.vy*dt; if((ty-oy)*(ty-je.y)<0){je.y=ty;je.vy=0;} } else je.y=ty;
    je.bank+=(clamp(je.vy/200,-1,1)-je.bank)*Math.min(1,7*dt);
    // BEAM SHIELD: a plane that flies into an active tractor beam (yours or the rival's) is EMP'd
    // -> it spins out into the background. The beam is a barrier; this also culls planes.
    if((mode!=='base' && planting && P.stun<=0 && Math.abs(je.x-P.x)<SAUCER_W()*0.45 && je.y>P.y-SAUCER_W()*0.12) ||
       (R && R.beamOn && R.stun<=0 && Math.abs(je.x-R.x)<SAUCER_W()*0.45 && je.y>R.y-SAUCER_W()*0.12)){ disableJet(je); continue; }   // beam shield — NOT in the base gauntlet (beam is OFF there; this was an invisible auto-defense)
    if(ons && (stg>=2 || aaHot)){ je.fireCd-=dt; if(je.fireCd<=0 && je.x>W*0.1 && je.x<W*0.9){ je.fireCd=stress?rnd(0.25,0.6):(defcon?rnd(0.6,1.15):rnd(0.8,1.6));
      if(stg>=3 && (mode==='base'||level>=2) && chance(0.3)){ shoot(je.x,je.y+10,je.vx*0.3,60,'missile','#ff5d6c'); shots[shots.length-1].tgt=fireTarget(); addFx(je.x,je.y,'spark','#ff9d3a',0.2); sfxT('rocket',0.5,0.3); }   // missiles: RED-only, rarer, NOT the first two zones — home on EITHER invader
      else { var ft=fireTarget(), dx=ft.x-je.x, dy=ft.y-je.y, L3=Math.hypot(dx,dy)||1; shoot(je.x,je.y,dx/L3*560,dy/L3*560,'tracer','#fff2a0'); } } }
    if(Math.hypot(je.x-P.x,je.y-P.y) < SAUCER_W()*0.42){

// One lane of the strip. Each tile takes a stable PHASE into the art so a 6-car strip stops looping:
// County Road 9 fits only ~1.4 strips on screen and 3 of its 6 vehicles are near-identical white-door
// units, so a fixed order read as clones. The phase is hashed off the ABSOLUTE tile index, not the
// scroll modulo, so a stretch of road keeps its cars as it scrolls instead of popping when a tile recycles.
// The source art FACES RIGHT (taillight at the left edge, headlight and windscreen rake at the right --
// checked against the strip, not assumed). A lane therefore flips only when it TRAVELS LEFT, and every
// car in it flips together: facing is a property of the lane, never of the individual car. Flipping per
// car -- which is what an earlier pass here did off the tile hash -- just puts cars in reverse.
function drawLane(im, scroll, y, bh, travelsLeft, alpha){
  var sw=im.naturalWidth, sh=im.naturalHeight, bw=bh*(sw/sh);
  var n0=Math.floor(scroll/bw), n1=Math.floor((scroll+W)/bw)+1;
  ctx.globalAlpha=alpha;
  for(var n=n0;n<=n1;n++){
    var x=n*bw-scroll, hsh=((n*2654435761)>>>0);
    var sx=((hsh>>>8)%1024)/1024*sw, w1=sw-sx, w1s=w1/sw*bw;
    ctx.save(); ctx.translate(x+bw/2,0);

    if(sx>0.5) ctx.drawImage(im, 0,0,sx,sh, -bw/2+w1s, y, sx/sw*bw, bh);

}

// narrow screen: at W=390 (a phone in portrait) 'DO YOU THINK YOU ARE ALONE?' wants clamp(18.7,28,60)
// = 28px, which measures ~416px against a 390px canvas, so it clips at BOTH margins. The proportional
// size would have fitted; the floor forced it wider than the screen. This measures the string and only
// shrinks when it genuinely does not fit, so nothing changes at any desktop width -- there the text was

function fitFont(txt, weight, px, fam, maxW){

// HEADLESS SOAK HOOK (dev-only): ?soak exposes window.__soak(N, defcon) — drives the engine through N
// full arcade runs with hostile random input, asserting invariants each tick; returns a JSON report.
if(/[?&]soak\b/.test(location.search)){
  window.__soak=function(n, sd){
    var breaches=[], errs=[], totalTicks=0, done=0, scores=[], maxEnt={t:0,j:0,s:0,f:0}, ended={over:0,ending:0,cap:0}, MAXT=45000;   // cover a full 9-segment run
    function chk(r,t){
      if(!(meter>=-0.01&&meter<=100.01)) breaches.push('meter='+(+meter).toFixed(1)+' r'+r+' t'+t);
      if(!isFinite(P.x)||!isFinite(P.y)) breaches.push('P nonfinite r'+r+' t'+t);
      if(R&&(!isFinite(R.x)||!isFinite(R.y))) breaches.push('R nonfinite r'+r);
      if(!(lives>=-1&&lives<=99)) breaches.push('lives='+lives+' r'+r);
      if(targets.length>60) breaches.push('targets='+targets.length+' r'+r);
      if(jets.length>40) breaches.push('jets='+jets.length+' r'+r);
      if(shots.length>300) breaches.push('shots='+shots.length+' r'+r);
      if(fx.length>600) breaches.push('fx='+fx.length+' r'+r);
      if(!isFinite(stageClock)) breaches.push('stageClock nonfinite r'+r);
      if(segIdx<0||segIdx>SCHEDULE.length) breaches.push('segIdx='+segIdx+' r'+r);
      if(targets.length>maxEnt.t)maxEnt.t=targets.length; if(jets.length>maxEnt.j)maxEnt.j=jets.length;
      if(shots.length>maxEnt.s)maxEnt.s=shots.length; if(fx.length>maxEnt.f)maxEnt.f=fx.length;
    }
    for(var r=0;r<n;r++){
      var seed=((r+1)*2654435761)>>>0, rng=function(){ seed=(seed*1103515245+12345)>>>0; return seed/4294967296; };
      try{
        twoP=false; defconArmed=!!sd; startCampaign();
        var t=0;
        while(state==='play' && t<MAXT){
          held.left=rng()<0.4; held.right=rng()<0.4; held.up=rng()<0.3; held.down=rng()<0.3; planting=rng()<0.5;
          if(rng()<0.03 && P && clock>P.warbleCd){ P.warbleU=clock+0.6; P.warbleCd=clock+2; }
          update(1/60); t++; totalTicks++; chk(r,t); if(breaches.length>40) break;
        }
        if(state==='over')ended.over++; else if(state==='ending')ended.ending++; else if(t>=MAXT)ended.cap++;
        scores.push(score||0); done++;
      }catch(e){ errs.push('r'+r+': '+(e&&e.message||(''+e))); }
      if(errs.length>15||breaches.length>40) break;
    }
    var avg=scores.length?Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length):0;
    return JSON.stringify({N:n,defcon:!!sd,done:done,totalTicks:totalTicks,ended:ended,breachCount:breaches.length,
      breaches:breaches.slice(0,15),errCount:errs.length,errs:errs.slice(0,15),avgScore:avg,maxScore:scores.length?Math.max.apply(null,scores):0,peakEntities:maxEnt});
  };
}

<script>
/* ---- PHONE PANEL (Joe 2026-10-07) ------------------------------------------------------------------------------
   Touch device held landscape (or ?touch): the game shrinks to the top, the cab control panel fills the bottom, and
   the painted sticks / buttons are the controls. It speaks the same KEYS the gamepad layer synthesizes, so every
   state (coin, ARE YOU ALONE? join, menus, play, continue) works untouched:
     P1 (green, left)  stick = arrows · BEAM = Space (hold) · WARBLE = X
     P2 (blue, right)  stick = I J K L · BEAM = ; (hold; also JOINS at the lock-in) · WARBLE = '
   Stick = 8-way, floating origin (wherever the thumb lands in the stick zone), the painted arrow lights up.
   Tap the centre legend to swap panel skins (ALT fluorescent / 1UP dark).
   DORMANT since 2026-10-14: only with ?panel=band (or =alt / =1up). */
(function(){
  var Q=new URLSearchParams(location.search), pan=document.getElementById('tpanel'); if(!pan||!document.body||!document.body.classList) return;
  var TOUCHDEV=Q.has('touch')||((('ontouchstart' in window)||navigator.maxTouchPoints>0)&&matchMedia('(pointer:coarse)').matches);
  if(!TOUCHDEV||window.top!==window) return;   // desktop + the DECK wrapper keep their own panel
  if(['band','alt','1up'].indexOf(Q.get('panel'))<0) return;   // RETIRED 2026-10-14 (Joe: looks good, too small to control) -- the PHONE PAD below is the phone build; ?panel=band brings this back
  var art=pan.querySelector('.art'), img=document.getElementById('tpimg'), fx=document.getElementById('tpfx'), g=fx.getContext('2d'), cv=document.getElementById('c');
  var AR=1800/368;   // band aspect (assets/cab/phone/panel-*-band.png)
  // hotspots in band fractions (measured on the art; both skins share the layout)
  var HS={ p1stick:{x:0.100,y:0.55,col:'#7dff3a'}, p1beam:{x:0.228,y:0.47,col:'#7dff3a'}, p1warble:{x:0.322,y:0.47,col:'#7dff3a'},
           p2stick:{x:0.675,y:0.55,col:'#2fd4ff'}, p2beam:{x:0.800,y:0.47,col:'#2fd4ff'}, p2warble:{x:0.895,y:0.47,col:'#2fd4ff'} };
  var KEYS={ p1:{up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',beam:' ',warble:'x'},
             p2:{up:'i',down:'k',left:'j',right:'l',beam:';',warble:"'"} };
  var SKINS=['alt','1up'], skin='alt'; try{ var sv=localStorage.getItem('suPanelSkin'); if(SKINS.indexOf(sv)>=0) skin=sv; }catch(_){}
  if(Q.get('panel')==='1up'||Q.get('panel')==='alt') skin=Q.get('panel');
  function setSkin(s){ skin=s; img.src='assets/cab/phone/panel-'+s+'-band.png'; try{localStorage.setItem('suPanelSkin',s);}catch(_){} }
  setSkin(skin);
  var TMODE=false, bw=0, bh=0;
  function layout(){
    TMODE=innerWidth>=innerHeight;
    document.body.classList.toggle('tmode',TMODE); document.body.classList.toggle('trot',!TMODE);
    if(TMODE){ bh=Math.round(Math.min(innerHeight*0.36, innerWidth/AR, 190)); bw=Math.round(bh*AR); }
    window.__suPanelH=TMODE?bh:0;
    document.documentElement.style.setProperty('--ph',bh+'px'); art.style.width=bw+'px';
    cv.style.bottom=(TMODE?bh:0)+'px';
    var d=Math.min(devicePixelRatio||1,2); fx.width=Math.round(bw*d); fx.height=Math.round(bh*d); g.setTransform(d,0,0,d,0,0);
    window.dispatchEvent(new Event('resize'));   // the game re-reads W/H (its resize subtracts __suPanelH)
  }
  var _lay=false; addEventListener('resize',function(){ if(_lay)return; _lay=true; layout(); _lay=false; });
  addEventListener('orientationchange',function(){ setTimeout(function(){ _lay=true; layout(); _lay=false; },150); });
  _lay=true; layout(); _lay=false;
  function key(type,k){ window.dispatchEvent(new KeyboardEvent(type,{key:k,bubbles:true,cancelable:true})); }
  function buzz(ms){ try{ navigator.vibrate&&navigator.vibrate(ms||10); }catch(_){} }
  // which control a touch landed on: by x within the band (side margins belong to the outer stick / warble)
  function zoneAt(cx){ var r=art.getBoundingClientRect(), f=(cx-r.left)/r.width;
    if(f<0.165) return 'p1stick'; if(f<0.275) return 'p1beam'; if(f<0.39) return 'p1warble';

    var X=[1,1,0,-1,-1,-1,0,1][a], Y=[0,1,1,1,0,-1,-1,-1][a];
    if(X>0)o.right=1; if(X<0)o.left=1; if(Y>0)o.down=1; if(Y<0)o.up=1; return o; }

  function glow(x,y,r,col,a){ var gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(255,255,255,'+(0.55*a)+')'); gr.addColorStop(0.35,col); gr.addColorStop(1,'rgba(0,0,0,0)');

    ['p1beam','p2beam'].forEach(function(z){ if(lit[z]) glow(HS[z].x*bw,HS[z].y*bh,bh*0.3,HS[z].col,0.9); });
    ['p1','p2'].forEach(function(pl){ var d=dirs[pl], dx=(d.right?1:0)-(d.left?1:0), dy=(d.down?1:0)-(d.up?1:0), h=HS[pl+'stick'];
      if(!dx&&!dy){ if(lit[pl+'stick']) glow(h.x*bw,h.y*bh,bh*0.16,h.col,0.35); return; }
      var n=Math.hypot(dx,dy), ax=h.x*bw+dx/n*bh*0.30, ay=h.y*bh+dy/n*bh*0.27;
      glow(ax,ay,bh*0.17,h.col,1); glow(h.x*bw+dx/n*bh*0.08,h.y*bh+dy/n*bh*0.07,bh*0.2,h.col,0.4); });
    g.globalCompositeOperation='source-over'; })();
  if(Q.has('qa')) window.__suPad={ dirs:dirs, zoneAt:zoneAt, h:function(){ return [window.__suPanelH, cv.height]; } };
})();

   HIGH TABLE's phone scheme: touch device held landscape (or ?touch) = the game plus ONE frame column holding WARBLE
   over BEAM, both on one thumb; nothing on the other side, so that thumb is free to fly. It speaks the P1 keys the
   gamepad layer synthesizes (BEAM = Space held, WARBLE = X), so every state works untouched.
     FLY  = drag anywhere on the game. RELATIVE (trackpad-style): the saucer moves with your thumb's motion from
            where it already is, so the thumb never covers the ship. Drives the engine's own fly-to-cursor (the
            capped lead + glide spring), via a synthesized mousemove.
     Menus / initials / vault (not in play): TAP the game = Space (coin / confirm), SWIPE = an arrow key.

  var HAND='L';   // SESSION-ONLY like the rest of SUCK UP (Joe: zero storage writes) -- ?hand=right is the bookmarkable lefty link
  var hq=(Q.get('hand')||'').toLowerCase(); if(hq==='right'||hq==='r') HAND='R'; else if(hq==='left'||hq==='l') HAND='L';
  var TMODE=false, colW=0, GAIN=1.35;

    var home=HAND==='R'?cR:cL; cL.classList.toggle('on',TMODE&&home===cL); cR.classList.toggle('on',TMODE&&home===cR);
    home.appendChild(bW); home.appendChild(bB);   // top->bottom WARBLE · BEAM (BEAM = the resting thumb)
    chip.style.left=HAND==='R'?'calc(env(safe-area-inset-left) + 10px)':''; chip.style.right=HAND==='R'?'':'calc(env(safe-area-inset-right) + 10px)';   // chip on the free side's top corner
    chip.textContent=HAND==='R'?'⇄ RIGHTY':'⇄ LEFTY';
    window.__suPanelW=colW; window.__suPanelH=0;
    cv.style.left=(TMODE&&HAND==='L')?colW+'px':'0px';
    window.dispatchEvent(new Event('resize'));   // the game re-reads W/H (its resize subtracts __suPanelW)
  }
  var _lay=false; function relay(){ if(_lay)return; _lay=true; layout(); _lay=false; }
  addEventListener('resize',relay); addEventListener('orientationchange',function(){ setTimeout(relay,150); }); relay();
  window.setSuHand=function(h){ HAND=h==='R'?'R':'L'; relay(); };
  chip.addEventListener('pointerdown',function(e){ e.preventDefault(); buzz(); setSuHand(HAND==='R'?'L':'R'); });
  // ---- buttons ----
  function press(el,down,up){
    el.addEventListener('pointerdown',function(e){ e.preventDefault(); try{el.setPointerCapture(e.pointerId);}catch(_){} el.classList.add('down'); buzz(); down&&down(); });
    var lift=function(){ if(!el.classList.contains('down'))return; el.classList.remove('down'); up&&up(); };
    el.addEventListener('pointerup',lift); el.addEventListener('pointercancel',lift); el.addEventListener('lostpointercapture',lift);
    el.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  }
  press(bB,function(){ key('keydown',' '); },function(){ key('keyup',' '); });
  press(bW,function(){ key('keydown','x'); key('keyup','x'); });
  // ---- the free thumb: fly (in play) / tap + swipe (everywhere else) ----
  var sid=null, o=null;
  function toClient(x,y){ var r=cv.getBoundingClientRect(); return [r.left+x*(r.width/(cv.width||1)), r.top+y*(r.height/(cv.height||1))]; }
  cv.addEventListener('pointerdown',function(e){ if(!TMODE||e.pointerType==='mouse') return;
    e.preventDefault();   // no compat mousedown: a touch on the game must never fire the mouse BEAM / right-click WARBLE
    if(sid!==null) return; sid=e.pointerId; try{cv.setPointerCapture(sid);}catch(_){}
    var pk=peek(), play=pk.state==='play'&&pk.ship;
    o={play:play, cx:e.clientX, cy:e.clientY, vx:play?pk.ship.x:0, vy:play?pk.ship.y:0, moved:0, sw:0}; });
  cv.addEventListener('pointermove',function(e){ if(e.pointerId!==sid||!o) return;
    var dx=e.clientX-o.cx, dy=e.clientY-o.cy;
    if(o.play){
      var nx=Math.max(0,Math.min(cv.width,o.vx+dx*GAIN)), ny=Math.max(0,Math.min(cv.height,o.vy+dy*GAIN));
      o.vx=nx; o.vy=ny; o.cx=e.clientX; o.cy=e.clientY;   // re-anchor every move: pinned at an edge, the way back is instant
      var c=toClient(nx,ny); cv.dispatchEvent(new MouseEvent('mousemove',{clientX:c[0],clientY:c[1],bubbles:true}));
    } else if(Math.hypot(dx,dy)>34){   // a swipe = one arrow press (keeps swiping = more presses)
      var k=Math.abs(dx)>Math.abs(dy)?(dx>0?'ArrowRight':'ArrowLeft'):(dy>0?'ArrowDown':'ArrowUp');
      key('keydown',k); key('keyup',k); buzz(6); o.sw++; o.cx=e.clientX; o.cy=e.clientY; } });
  function up(e){ if(e.pointerId!==sid) return; sid=null; var t=o; o=null;
    if(t&&!t.play&&!t.sw){ key('keydown',' '); key('keyup',' '); buzz(10); } }   // a TAP = coin / confirm
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  addEventListener('blur',function(){ if(bB.classList.contains('down')){ bB.classList.remove('down'); key('keyup',' '); } });
  // ---- live state: WARBLE cooldown ring, chip only off-play ----
  (function tick(){ requestAnimationFrame(tick); if(!TMODE) return; var pk=peek();
    var cd=pk.wcd||0; bW.classList.toggle('cd',cd>0); bW.style.setProperty('--p',1-Math.min(1,cd/2.0));
    chip.style.display=pk.state==='play'?'none':''; })();
  if(Q.has('qa')) window.__suPhone={ peek:peek, hand:function(){ return HAND; }, colW:function(){ return colW; } };
})();
</script>
